name: Serdar 26-locale test preview

on:
  push:
    branches:
      - test/serdar-26-regional-preview-20261023

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    if: github.ref == 'refs/heads/test/serdar-26-regional-preview-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build and validate noindex preview only
        run: |
          set -euo pipefail
          python3 serdar-26-test/validate_manifest.py
          python3 serdar-26-test/build_preview.py
          python3 serdar-26-test/validate_preview.py
      - name: Normalize Cloudflare account id for test preview
        id: cloudflare_account
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          account_id="$raw"
          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then
            account_id="${BASH_REMATCH[1]}"
          fi
          [[ "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy test preview only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare_account.outputs.account_id }}
          command: pages deploy serdar-26-test/dist --project-name=serdararminsargut --branch=test-serdar-26
