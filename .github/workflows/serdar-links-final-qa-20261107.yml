name: Serdar link hub language verification
on:
  push:
    branches: ['test/serdar-links-final-qa-20261107']
    paths: ['.github/workflows/serdar-links-final-qa-20261107.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Verify language and navigation
        run: |
          python - <<'PY'
          import http.server,threading
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          threading.Thread(target=http.server.ThreadingHTTPServer(('127.0.0.1',8765),http.server.SimpleHTTPRequestHandler).serve_forever,daemon=True).start()
          Path('qa').mkdir(exist_ok=True)
          langs={'tr':'/links/','en':'/links/en/','ar':'/links/ar/','ru':'/links/ru/'}
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--no-sandbox'])
              for lang,path in langs.items():
                  for width in [360,390,430,1280]:
                      ctx=browser.new_context(viewport={'width':width,'height':844})
                      page=ctx.new_page()
                      page.route('**/*',lambda r:r.continue_() if r.request.url.startswith('http://127.0.0.1:8765/') else r.abort())
                      assert page.goto('http://127.0.0.1:8765'+path,wait_until='load').status==200
                      assert page.locator('html').get_attribute('lang')==lang,(lang,width,page.locator('html').get_attribute('lang'))
                      assert page.locator('a[aria-current=page]').get_attribute('data-lang')==lang
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      assert page.locator('a[data-key=casting]').get_attribute('href')=='/casting-card/'+lang
                      assert page.locator('a[data-key=showreel]').count()==1
                      assert page.locator('#cta-list a.cta').count()==17
                      for key in ['linkedin','vimeo','behance','tiktok','substack','wordpress','blogger','linktree','whatsapp']:
                          assert page.locator('a[data-key='+key+']').count()==1,(lang,key)
                      if lang=='ru':
                          assert 'Смотреть' in page.locator('a[data-key=showreel]').inner_text()
                          assert 'Реклама' in page.locator('a[data-key=modeling]').inner_text()
                          assert 'Кастинг' in page.locator('a[data-key=contact]').inner_text()
                      page.screenshot(path='qa/'+lang+'-'+str(width)+'.png',full_page=True)
                      print('PASS',lang,width,flush=True)
                      ctx.close()
              ctx=browser.new_context(java_script_enabled=False,viewport={'width':390,'height':844})
              page=ctx.new_page()
              assert page.goto('http://127.0.0.1:8765/links/ru/').status==200
              assert 'Реклама' in page.locator('a[data-key=modeling]').inner_text()
              assert 'Кастинг' in page.locator('a[data-key=contact]').inner_text()
              print('RU_NO_JS_PASS',flush=True)
              browser.close()
          PY
          sha256sum --check scripts/serdar-comp-card-sha256-20261107.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serdar-links-mobile-proof
          path: qa/
          retention-days: 7
