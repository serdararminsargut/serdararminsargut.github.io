name: Hero gradient A/B once

on:
  push:
    paths:
      - '.github/workflows/hero-gradient-ab-once.yml'

permissions:
  contents: write

jobs:
  hero-gradient-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge mobile hero overlays into one pseudo-element
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/css/site.css')
          original = path.read_text(encoding='utf-8')

          before = '.hero-media:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,9,9,.7) 0%,rgba(9,9,9,.48) 34%,rgba(9,9,9,.14) 64%,rgba(9,9,9,.18) 100%);z-index:1}'
          after = '.hero-media:after{z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.05) 42%,rgba(0,0,0,.50) 64%,rgba(0,0,0,.95) 100%)}'
          merged_before = '.hero-media:before{content:none}'
          merged_after = '.hero-media:after{z-index:2;background:linear-gradient(90deg,rgba(9,9,9,.7) 0%,rgba(9,9,9,.48) 34%,rgba(9,9,9,.14) 64%,rgba(9,9,9,.18) 100%),linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.05) 42%,rgba(0,0,0,.50) 64%,rgba(0,0,0,.95) 100%)}'

          if original.count(before) != 1:
              raise SystemExit(f'Expected one mobile :before overlay, found {original.count(before)}')
          if original.count(after) != 1:
              raise SystemExit(f'Expected one mobile :after overlay, found {original.count(after)}')

          updated = original.replace(before, merged_before, 1).replace(after, merged_after, 1)

          # Guardrail: hero image filter:none must remain from first A/B round.
          if 'filter:none' not in updated:
              raise SystemExit('Hero filter:none missing')

          path.write_text(updated, encoding='utf-8')
          print('Merged mobile hero overlays into one pseudo-element; visual gradients preserved.')

      - name: Commit A/B change and remove one-time workflow
        run: |
          rm .github/workflows/hero-gradient-ab-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: merge mobile hero gradient overlays for LCP A/B test"
          git push
