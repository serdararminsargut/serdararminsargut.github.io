name: One-time mobile navigation patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-mobile-nav-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch compact mobile navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* V15.4 — compact mobile navigation: no horizontal scroll */'
          if marker in s:
              print('Mobile navigation patch already present')
              raise SystemExit(0)

          css = r'''

/* V15.4 — compact mobile navigation: no horizontal scroll */
@media(max-width:820px){
  nav .wrap{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    align-items:stretch;
    overflow-x:visible;
    padding:8px 0;
  }
  nav .wrap > a{display:none}
  nav .wrap > a[href="#portfolio"],
  nav .wrap > a[href="/casting-card/v2.html"],
  nav .wrap > a[href="#showreel"],
  nav .wrap > a[href="/blog/"],
  nav .wrap > a[href="#iletisim"]{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    min-height:36px;
    padding:7px 5px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:.72rem;
    line-height:1.1;
    text-align:center;
    white-space:normal;
  }
  nav .wrap > a[href="/casting-card/v2.html"],
  nav .wrap > a[href="/blog/"]{
    color:var(--accent);
    border-color:rgba(205,177,124,.72);
    font-weight:800;
  }
  nav .lang{
    grid-column:1/-1;
    width:100%;
    margin:0;
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    gap:3px;
  }
  nav .lang a{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    padding:4px 2px;
    font-size:.65rem;
    line-height:1;
  }
}
@media(max-width:360px){
  nav .wrap{gap:4px}
  nav .wrap > a[href="#portfolio"],
  nav .wrap > a[href="/casting-card/v2.html"],
  nav .wrap > a[href="#showreel"],
  nav .wrap > a[href="/blog/"],
  nav .wrap > a[href="#iletisim"]{font-size:.68rem;padding:6px 3px}
  nav .lang a{font-size:.61rem}
}
'''
          needle = '\n</style>'
          if needle not in s:
              raise SystemExit('Could not locate closing style tag')
          s = s.replace(needle, css + needle, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched index.html mobile navigation')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'sargutportfolio'
          git config user.email 'aydinsargut@gmail.com'
          git add index.html
          git commit -m 'fix: keep Blog and Comp Card visible on mobile'
          git push origin main
