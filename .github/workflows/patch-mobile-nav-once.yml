name: One-time mobile navigation patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch compact mobile navigation
        shell: bash
        env:
          NAV_CSS_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* V15.4 — compact mobile navigation: no horizontal scroll */'
          if marker not in s:
              css = base64.b64decode(os.environ['NAV_CSS_B64']).decode('utf-8')
              if '\n</style>' not in s:
                  raise SystemExit('Could not locate closing style tag')
              s = s.replace('\n</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html change required'
            exit 0
          fi
          git config user.name 'sargutportfolio'
          git config user.email 'aydinsargut@gmail.com'
          git add index.html
          git commit -m 'fix: keep Blog and Comp Card visible on mobile'
          git push origin main
