name: Serdar localized CSP fix verification
on:
  push:
    branches: ['test/serdar-locale-csp-qa-20261107']
    paths: ['.github/workflows/serdar-locale-csp-fix-qa-20261107.yml']
permissions:
  contents: read
jobs:
  csp-fix-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Check unchanged scripts and local behavior under CSP
        run: |
          python - <<'PY'
          import http.server,threading,json,subprocess,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          langs=['en','ar','ru','az','kk','uz','ky']
          base='71f636a889bf62d73beac7ff9e616ef4df166f07'
          for lang in langs:
              old=subprocess.check_output(['git','show',base+':'+lang+'/index.html']).decode()
              scripts=re.findall(r'<script>(.*?)</script>',old,re.S)
              assert len(scripts)==2
              assert Path('assets/js/locale-ga-init-20261107.js').read_text()==scripts[0]
              assert Path('assets/js/locale-interactions-'+lang+'-20261107.js').read_text()==scripts[1]
              new=Path(lang+'/index.html').read_text()
              rebuilt=new.replace('<script src="/assets/js/locale-ga-init-20261107.js"></script>','<script>'+scripts[0]+'</script>')
              rebuilt=rebuilt.replace('<script src="/assets/js/locale-interactions-'+lang+'-20261107.js"></script>','<script>'+scripts[1]+'</script>')
              assert rebuilt==old,lang
          line=next(x.strip() for x in Path('_headers').read_text().splitlines() if x.strip().startswith('Content-Security-Policy:'))
          csp=line.split(':',1)[1].strip()
          class Server(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/casting-card/') and not self.path.endswith('.html'):
                      self.path+='.html'
                  return super().do_GET()
              def end_headers(self):
                  self.send_header('Content-Security-Policy',csp)
                  super().end_headers()
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8767),Server)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          rows=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':390,'height':844})
              page.route('**/*',lambda r:r.continue_() if r.request.url.startswith('http://127.0.0.1:8767/') else r.abort())
              page.add_init_script("""window.__violations=[];document.addEventListener('securitypolicyviolation',e=>window.__violations.push({directive:e.violatedDirective,blocked:e.blockedURI}));""")
              for lang in langs:
                  for width in [360,390,430,1280]:
                      page.set_viewport_size({'width':width,'height':844})
                      response=page.goto('http://127.0.0.1:8767/'+lang+'/',wait_until='load')
                      assert response and response.status==200
                      assert page.evaluate("typeof window.gtag")=='function',(lang,width,'ga init')
                      assert page.evaluate("typeof window.sasTrackInstagram")=='function',(lang,width,'interactions')
                      gallery=page.locator('[data-lightbox]:not([data-instagram-tile="true"])').first
                      gallery.click(timeout=10000)
                      assert page.locator('.lightbox.open').count()==1,(lang,width,'gallery')
                      page.locator('.lightbox button').click()
                      assert page.locator('.lightbox.open').count()==0,(lang,width,'gallery close')
                      page.locator('[data-video]').first.click()
                      assert page.locator('.video-modal.open').count()==1,(lang,width,'video modal')
                      assert 'player.vimeo.com/video/' in page.locator('.video-modal iframe').get_attribute('src'),(lang,width,'video url')
                      page.locator('.video-close').click()
                      assert page.locator('.video-modal.open').count()==0,(lang,width,'video close')
                      assert not page.evaluate("window.__violations.some(x=>x.directive.startsWith('script-src') && x.blocked==='inline')"),(lang,width,'inline blocked')
                      nav=page.locator('nav a[data-comp-card-link="nav"]')
                      with page.expect_navigation(wait_until='load',timeout=20000) as event: nav.click(timeout=10000)
                      dest=event.value
                      assert dest and dest.status==200 and page.url.endswith('/casting-card/'+lang),(lang,width,'card navigation')
                      rows.append({'lang':lang,'width':width,'result':'PASS'})
                      print('CSP_FIX_QA',lang,width,'PASS',flush=True)
              browser.close()
          Path('csp-fix-results.json').write_text(json.dumps(rows,indent=2),encoding='utf8')
          assert len(rows)==28
          print('CSP_FIX_LOCAL_PASS 28/28',flush=True)
          PY
      - name: Save findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csp-fix-results
          path: csp-fix-results.json
          retention-days: 7
          if-no-files-found: warn
