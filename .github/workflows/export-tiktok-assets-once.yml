name: Export TikTok assets once
on:
  push:
    paths:
      - '.github/workflows/export-tiktok-assets-once.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect selected portfolio assets
        run: |
          mkdir -p export-assets
          cp assets/photos/serdar-armin-sargut-cocuk-oyuncu-model-portre-1536-v12-1-20260826.webp export-assets/01-headshot.webp
          cp assets/photos/serdar-armin-sargut-bej-takim-tam-boy.webp export-assets/02-full-body.webp
          cp assets/photos/serdar-armin-sargut-bej-katalog-portre.webp export-assets/03-catalog.webp
          cp assets/photos/serdar-armin-sargut-beyaz-tisort-lifestyle.webp export-assets/04-lifestyle.webp
          cp assets/photos/serdar-armin-sargut-futbol-spor-portre.webp export-assets/05-sportswear.webp
          cp assets/photos/serdar-armin-sargut-gri-takim-yelek.webp export-assets/06-classic.webp
          if [ -f assets/photos/serdar-armin-sargut-set-kamera-arkasi.webp ]; then cp assets/photos/serdar-armin-sargut-set-kamera-arkasi.webp export-assets/07-set.webp; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-comp-card-assets
          path: export-assets/
          if-no-files-found: error
          retention-days: 1
