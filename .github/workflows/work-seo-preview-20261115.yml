name: Serdar isolated SEO preview and preservation
'on':
  push:
    branches:
    - test/work-seo-serdar-20261115
permissions:
  contents: read
concurrency:
  group: work-seo-serdar-20261115
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == 'serdararminsargut/serdararminsargut.github.io' && github.ref == 'refs/heads/test/work-seo-serdar-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Guard immutable main and preview deployment target (GET only)
      env:
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/work_seo_cf_guard.py before --project serdararminsargut --repo serdararminsargut/serdararminsargut.github.io --base 5ed2bfbeaf0f47e309c4045a515450698c7ddc68 --branch test/work-seo-serdar-20261115 --production-id e0b730fa-64ab-4a58-a978-5e0baa0b093d
    - name: Build baseline in isolated local worktree
      run: |+
        git worktree add --detach ../baseline 5ed2bfbeaf0f47e309c4045a515450698c7ddc68
        cd ../baseline
        set -euo pipefail
        rm -rf dist
        mkdir -p dist

        for item in \
          .nojekyll \
          .well-known \
          _headers \
          _redirects \
          404.html \
          ai.txt \
          ar \
          assets \
          az \
          blog \
          card.html \
          casting-card \
          de \
          downloads \
          en \
          fa \
          favicon.svg \
          favicon.ico \
          favicon-96x96.png \
          fr \
          index.html \
          indexnow-key.txt \
          72f0dad836e29ffcc2d9dd42a794dbf0.txt \
          erkek-cocuk-model \
          spor-giyim-cocuk-modeli \
          cocuk-giyim-modeli \
          e-ticaret-cocuk-modeli \
          it \
          kk \
          ky \
          llms.txt \
          llms-full.txt \
          links \
          postcard.html \
          projeler \
          rehber \
          robots.txt \
          ru \
          sitemap.xml \
          sitemap-google.xml \
          sitemap.txt \
          tk \
          uz \
          zh-cn \
          yandex_*.html
        do
          if compgen -G "$item" > /dev/null; then
            cp -R $item dist/
          elif [ -e "$item" ]; then
            cp -R "$item" dist/
          fi
        done

    - name: Build candidate without deploying production
      run: |
        set -euo pipefail
        rm -rf dist
        mkdir -p dist

        for item in \
          .nojekyll \
          .well-known \
          _headers \
          _redirects \
          404.html \
          ai.txt \
          ar \
          assets \
          az \
          blog \
          card.html \
          casting-card \
          de \
          downloads \
          en \
          fa \
          favicon.svg \
          favicon.ico \
          favicon-96x96.png \
          fr \
          index.html \
          indexnow-key.txt \
          72f0dad836e29ffcc2d9dd42a794dbf0.txt \
          erkek-cocuk-model \
          spor-giyim-cocuk-modeli \
          cocuk-giyim-modeli \
          e-ticaret-cocuk-modeli \
          it \
          kk \
          ky \
          llms.txt \
          llms-full.txt \
          links \
          postcard.html \
          projeler \
          rehber \
          robots.txt \
          ru \
          sitemap.xml \
          sitemap-google.xml \
          sitemap.txt \
          tk \
          uz \
          zh-cn \
          yandex_*.html
        do
          if compgen -G "$item" > /dev/null; then
            cp -R $item dist/
          elif [ -e "$item" ]; then
            cp -R "$item" dist/
          fi
        done
    - name: Validate production-shaped source SEO
      run: python3 scripts/seo_static_audit.py --root dist --origin https://serdararminsargut.com --require-complete-hreflang
    - name: Seal preview build only
      run: python3 scripts/work_seo_seal_preview.py dist
    - name: Verify protected paths, PDF bytes, photos and page bodies
      run: python3 scripts/work_seo_preservation.py ../baseline/dist dist --project serdar
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install browser and local Pages runtime
      run: |
        python3 -m pip install playwright==1.63.0
        python3 -m playwright install --with-deps chromium
        npm install --no-save wrangler@4 lighthouse
    - name: Test isolated local Pages output in Chromium
      id: local_browser
      continue-on-error: true
      run: |
        set -euo pipefail
        mkdir -p work-evidence
        CLOUDFLARE_SEND_METRICS=false npx wrangler pages dev dist --port 8788 --ip 127.0.0.1 >work-evidence/local-pages.log 2>&1 &
        echo $! > work-evidence/local-pages.pid
        for attempt in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8788/ >/dev/null; then break; fi
          sleep 1
        done
        python3 scripts/work_seo_browser_qa.py --project serdar --root dist
    - name: Measure local mobile Lighthouse (lab only)
      continue-on-error: true
      run: |-
        npx lighthouse http://127.0.0.1:8788/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=work-evidence/lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --quiet
        python3 - <<'PY'
        import json
        x=json.load(open('work-evidence/lighthouse-mobile.json'))
        print('LOCAL_LIGHTHOUSE_LAB',json.dumps({k:v.get('score') for k,v in x['categories'].items()}))
        for k in ['largest-contentful-paint','cumulative-layout-shift','first-contentful-paint','total-blocking-time']:
         print(k,x['audits'][k].get('numericValue'))
        PY
    - name: Normalize account identifier without logging credentials
      id: account
      env:
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |-
        python3 - <<'PY'
        import os,re
        x=os.environ['CF_ACCOUNT'];m=re.search(r'dash\.cloudflare\.com/([a-fA-F0-9]{32})',x)
        if m:x=m[1]
        assert re.fullmatch('[a-fA-F0-9]{32}',x)
        print('::add-mask::'+x)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('id='+x+'\n')
        PY
    - name: Deploy exact test branch as Cloudflare PREVIEW only
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ steps.account.outputs.id }}
        command: pages deploy dist --project-name=serdararminsargut --branch=test/work-seo-serdar-20261115 --commit-hash=${{ github.sha }}
    - name: Resolve successful preview with identical source SHA
      id: preview
      env:
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/work_seo_cf_guard.py resolve --project serdararminsargut --repo serdararminsargut/serdararminsargut.github.io --base 5ed2bfbeaf0f47e309c4045a515450698c7ddc68 --branch test/work-seo-serdar-20261115 --production-id e0b730fa-64ab-4a58-a978-5e0baa0b093d
    - name: Verify real preview HTTP noindex
      run: |-
        python3 - <<'PY'
        import json,urllib.request,urllib.parse
        x=json.load(open('work-evidence/preview.json'));rows=[]
        for path in ['/','/casting-card/tr','/robots.txt']:
         req=urllib.request.Request(x['url']+path,headers={'User-Agent':'Mozilla/5.0'})
         with urllib.request.urlopen(req,timeout=30) as r:
          actual_host=urllib.parse.urlsplit(r.url).hostname
          blocked=actual_host!=urllib.parse.urlsplit(x['url']).hostname
          row={'path':path,'status':r.status,'final_host':actual_host,'x_robots_tag':r.headers.get('X-Robots-Tag',''),'result':'BLOCKED_ACCESS' if blocked else 'PASS' if r.status==200 and 'noindex' in r.headers.get('X-Robots-Tag','').lower() else 'FAIL'}
          rows.append(row);print('PREVIEW_HTTP_RESULT',json.dumps(row))
        open('work-evidence/preview-http.json','w').write(json.dumps(rows,indent=2))
        if any(x['result']!='PASS' for x in rows):raise SystemExit(1)
        PY
      continue-on-error: true
    - name: Verify production main and configuration unchanged
      if: always()
      env:
        CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/work_seo_cf_guard.py after --project serdararminsargut --repo serdararminsargut/serdararminsargut.github.io --base 5ed2bfbeaf0f47e309c4045a515450698c7ddc68 --branch test/work-seo-serdar-20261115 --production-id e0b730fa-64ab-4a58-a978-5e0baa0b093d
    - name: Archive exact evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serdar-work-seo-evidence-${{ github.sha }}
        path: work-evidence/
        retention-days: 14
    - name: Emit preservation evidence
      if: always()
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        for f in Path('work-evidence').glob('*.json'):
         if f.name in ('lighthouse-mobile.json','browser-qa.json'): continue
         print('WORK_EVIDENCE_FILE',f.name);print(f.read_text())
        PY
