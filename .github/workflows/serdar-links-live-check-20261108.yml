name: Verify published Serdar links
on:
  push:
    branches: ['test/serdar-links-live-check-20261108']
    paths: ['.github/workflows/serdar-links-live-check-20261108.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
      - name: Verify four languages and protected PDF files
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base='https://serdararminsargut.com'
          count=0
          for line in Path('scripts/serdar-comp-card-sha256-20261107.txt').read_text().splitlines():
              digest,path=line.split(maxsplit=1)
              req=urllib.request.Request(base+'/'+path.lstrip('*').lstrip('./'),headers={'User-Agent':'Mozilla/5.0 ReleaseProof/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  assert resp.status==200
                  assert hashlib.sha256(resp.read()).hexdigest()==digest,path
              count+=1
          assert count==26
          print('LIVE_PDF_HASH_PASS',count,flush=True)
          Path('qa').mkdir(exist_ok=True)
          langs={'tr':'/links/','en':'/links/en/','ar':'/links/ar/','ru':'/links/ru/'}
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--no-sandbox'])
              for lang,path in langs.items():
                  for width in [360,390,430,1280]:
                      ctx=browser.new_context(viewport={'width':width,'height':844})
                      page=ctx.new_page()
                      page.route('**/*',lambda r:r.continue_() if r.request.url.startswith(base+'/') else r.abort())
                      resp=page.goto(base+path,wait_until='load',timeout=45000)
                      assert resp and resp.status==200,(lang,resp.status if resp else None)
                      assert page.locator('html').get_attribute('lang')==lang,(lang,page.locator('html').get_attribute('lang'))
                      assert page.locator('a[aria-current=page]').get_attribute('data-lang')==lang
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      assert page.locator('a[data-key=casting]').get_attribute('href')=='/casting-card/'+lang
                      assert page.locator('#cta-list a.cta').count()==17
                      for key in ['linkedin','vimeo','behance','tiktok','substack','wordpress','blogger','linktree','whatsapp']:
                          assert page.locator('a[data-key='+key+']').count()==1,(lang,key)
                      assert page.locator('a[data-key=linkedin]').get_attribute('href')=='https://lnkd.in/p/dka6c8RG'
                      if lang=='ru':
                          assert 'Смотреть' in page.locator('a[data-key=showreel]').inner_text()
                          assert 'Кастинг' in page.locator('a[data-key=contact]').inner_text()
                      page.screenshot(path='qa/'+lang+'-'+str(width)+'.png',full_page=True)
                      print('LIVE_LINK_PASS',lang,width,flush=True)
                      ctx.close()
              browser.close()
          print('LIVE_LINK_PASS 16/16',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serdar-live-links-qa
          path: qa/
          retention-days: 7
          if-no-files-found: warn
