name: Serdar SEO lastmod isolated Pages preview (test only)
on:
  push:
    branches:
      - test/serdar-seo-lastmod-20261020
    paths:
      - sitemap.xml
      - sitemap-google.xml
      - .github/workflows/serdar-seo-lastmod-preview-20261020.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: serdar-seo-lastmod-isolated-preview-20261020
  cancel-in-progress: true

jobs:
  preview-only:
    if: github.ref == 'refs/heads/test/serdar-seo-lastmod-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce immutable release boundary and sitemap invariants
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "serdararminsargut/serdararminsargut.github.io"
          test "${GITHUB_REF}" = "refs/heads/test/serdar-seo-lastmod-20261020"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          N = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          arrays = []
          for fn in ['sitemap.xml', 'sitemap-google.xml']:
              root = ET.parse(fn).getroot()
              items = []
              for row in root.findall('s:url', N):
                  u = row.findtext('s:loc', namespaces=N)
                  dt = row.findtext('s:lastmod', namespaces=N)
                  assert u and u.startswith('https://serdararminsargut.com/')
                  assert dt is None or (len(dt) == 10 and dt[:4].isdigit())
                  items.append(u)
              assert len(items) == 90 and len(set(items)) == 90, fn
              arrays.append(items)
          assert arrays[0] == arrays[1], 'Sitemap URL inventory mismatch'
          expected = ['https://serdararminsargut.com/',
                      'https://serdararminsargut.com/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/',
                      'https://serdararminsargut.com/links/ru/']
          for fn in ['sitemap.xml', 'sitemap-google.xml']:
              s = Path(fn).read_text(encoding='utf-8')
              for url in expected:
                  assert '<loc>'+url+'</loc><lastmod>2026-10-17</lastmod>' in s, (fn,url)
          print('90 URL uniqueness, parity, XML, and 3 lastmod revisions: PASS')
          PY
      - name: Copy unchanged static site into isolated preview bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for item in .nojekyll _headers _redirects 404.html ai.txt ar assets az blog card.html casting-card de downloads en fa favicon.svg favicon.ico favicon-96x96.png fr index.html indexnow-key.txt 72f0dad836e29ffcc2d9dd42a794dbf0.txt erkek-cocuk-model spor-giyim-cocuk-modeli cocuk-giyim-modeli e-ticaret-cocuk-modeli it kk ky llms.txt llms-full.txt links postcard.html projeler rehber robots.txt ru sitemap.xml sitemap-google.xml sitemap.txt tk uz zh-cn; do
            if test -e "$item"; then cp -R "$item" dist/; fi
          done
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/sitemap-google.xml
          test -s dist/_headers
      - name: Produce unchanged four optimized Comp Card PDFs for representative preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0' 'pypdf>=5,<7' 'Pillow>=10,<13'
          python3 -m playwright install --with-deps chromium
          python3 scripts/serdar_generate_comp_cards.py dist
          for lang in TR EN AR RU; do
            file="dist/downloads/Serdar-Armin-Sargut-Comp-Card-$lang.pdf"
            test -s "$file"
            head -c 5 "$file" | grep -Fq '%PDF-'
            size=$(stat -c%s "$file")
            (( size > 20000 && size < 1200000 )) || { echo "PDF size outside published limits: $file $size"; exit 1; }
          done
      - name: Enforce preview-wide anti-indexing (bundle only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/_headers')
          s=p.read_text(encoding='utf-8')
          assert s.startswith('/*\n')
          assert 'X-Robots-Tag: noindex' not in s
          s=s.replace('/*\n','/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n',1)
          p.write_text(s,encoding='utf-8')
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n',encoding='utf-8')
          assert 'X-Robots-Tag: noindex' in p.read_text(encoding='utf-8')
          print('ISOLATED_PREVIEW_NOINDEX_GUARD_PASS')
          PY
          sha256sum dist/index.html dist/robots.txt dist/_headers dist/sitemap.xml dist/sitemap-google.xml
      - name: Normalize existing Cloudflare account ID without changing settings
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          id="$raw"
          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then id="${BASH_REMATCH[1]}"; fi
          [[ "$id" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Missing valid account id; deployment skipped'; exit 1; }
          echo "::add-mask::$id"
          echo "account_id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy test-only Serdar Pages branch preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy dist --project-name=serdararminsargut --branch=test/serdar-seo-lastmod-20261020
      - name: Verify actual preview HTTP, index guard, sitemap dates and four PDF downloads
        shell: bash
        run: |
          set -euo pipefail
          base='https://test-serdar-seo-lastmod-2026.serdararminsargut.pages.dev'
          mkdir -p /tmp/serdar-seo-preview
          for route in / /en/ /links/ru/ /robots.txt /sitemap.xml /sitemap-google.xml; do
            key=$(printf '%s' "$route" | tr '/.' '__')
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/serdar-seo-preview/headers -o "/tmp/serdar-seo-preview/$key" -w '%{http_code}' "$base$route" || true)
              test "$code" = 200 && break
              sleep 3
            done
            test "$code" = 200 || { echo "Preview HTTP ERROR $route $code"; exit 1; }
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex' /tmp/serdar-seo-preview/headers || { echo "Preview X-Robots-Tag noindex MISSING for $route"; exit 1; }
          done
          grep -Fq 'Disallow: /' /tmp/serdar-seo-preview/_robots_txt || { echo 'Preview robots must block crawling'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          paths=[Path('/tmp/serdar-seo-preview/_sitemap_xml'),Path('/tmp/serdar-seo-preview/_sitemap-google_xml')]
          dates=[]
          for p in paths:
              root=ET.parse(p).getroot()
              rows=root.findall('sm:url',ns)
              assert len(rows)==90,(p,len(rows))
              values={v.findtext('sm:loc',namespaces=ns):v.findtext('sm:lastmod',namespaces=ns) for v in rows}
              assert len(values)==90
              for url in ('https://serdararminsargut.com/','https://serdararminsargut.com/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/','https://serdararminsargut.com/links/ru/'):
                  assert values[url]=='2026-10-17',(p,url,values.get(url))
              dates.append(list(values))
          assert dates[0]==dates[1]
          print('PREVIEW_HTTP_SITEMAP_90_URL_PASS')
          PY
          for lang in TR EN AR RU; do
            url="$base/downloads/Serdar-Armin-Sargut-Comp-Card-$lang.pdf"
            code=$(curl -sS -L --connect-timeout 8 --max-time 30 -D /tmp/serdar-seo-preview/headers -o /tmp/serdar-seo-preview/pdf -w '%{http_code}' "$url" || true)
            test "$code" = 200 || { echo "Preview Comp Card PDF $lang returned $code"; exit 1; }
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex' /tmp/serdar-seo-preview/headers
            head -c 5 /tmp/serdar-seo-preview/pdf | grep -Fq '%PDF-'
          done
          echo 'PREVIEW_HTTP_NO_INDEX_SITEMAP_PDF_PASS'
