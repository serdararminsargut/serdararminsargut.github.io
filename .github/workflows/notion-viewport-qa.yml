name: Notion link-hub viewport QA - isolated branch
on:
  push:
    branches:
      - qa/notion-viewport-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QA_ROUTES: "/links/|/links/en/"
      QA_TARGET: "https://flawless-wren-eb9.notion.site/Serdar-Armin-Sargut-Official-Acting-Modeling-Portfolio-412f6b33563e80048dfdd1a3950fa6e1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium automation dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local source-content server (not Cloudflare production)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/notion-http.log 2>&1 &
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 1; done
      - name: Render and test real source pages at 360 390 430 and 1280 CSS pixels
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            fs.mkdirSync('qa-screenshots', {recursive:true});
            const b = await chromium.launch({headless:true});
            let faults=[];
            const routes = process.env.QA_ROUTES.split('|');
            for(const route of routes) {
              for(const width of [360,390,430,1280]) {
                const ctx = await b.newContext({viewport:{width,height:900},deviceScaleFactor:1});
                const page = await ctx.newPage();
                try {
                  const response=await page.goto('http://127.0.0.1:8765'+route,{waitUntil:'load',timeout:20000});
                  await page.waitForTimeout(350);
                  const v=await page.evaluate((target)=>{
                    const links=[...document.querySelectorAll('a[href]')].filter(a=>a.href===target);
                    const notion=links[0];
                    const rect=notion?.getBoundingClientRect();
                    return {
                      viewport:innerWidth,
                      scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),
                      links:links.length,
                      target:notion?.getAttribute('target')||'',
                      rel:notion?.getAttribute('rel')||'',
                      notionRect:rect?{left:rect.left,right:rect.right,width:rect.width}:null,
                      cssSheets:document.styleSheets.length,
                      title:document.title
                    };
                  },process.env.QA_TARGET);
                  const overflow=Math.max(0,v.scrollWidth-v.viewport);
                  const problems=[];
                  if(!response || response.status()!==200)problems.push('HTTP_NOT_200');
                  if(v.viewport!==width)problems.push('VIEWPORT_MISMATCH');
                  if(overflow>1)problems.push('HORIZONTAL_OVERFLOW_'+overflow);
                  if(v.links!==1)problems.push('WRONG_NOTION_COUNT_'+v.links);
                  if(v.target!=='_blank')problems.push('TARGET_NOT_BLANK');
                  if(!v.rel.split(/\s+/).includes('noopener')||!v.rel.split(/\s+/).includes('noreferrer'))problems.push('REL_UNSAFE');
                  if(!v.notionRect || v.notionRect.left < -1 || v.notionRect.right > width+1)problems.push('CTA_CLIPPED');
                  if(v.cssSheets < 1)problems.push('NO_CSS_LOADED');
                  const stem=route.replace(/\W+/g,'_').replace(/^_+|_+$/g,'');
                  await page.screenshot({path:'qa-screenshots/'+stem+'-'+width+'.png',fullPage:true});
                  console.log(JSON.stringify({route,width,status:problems.length?'FAIL':'PASS',overflow,...v,problems}));
                  if(problems.length)faults.push(route+' '+width+' '+problems.join(','));
                } catch(e) {
                  faults.push(route+' '+width+' '+String(e));
                  console.error('QA_EXCEPTION '+route+' '+width+' '+e);
                } finally {await ctx.close();}
              }
            }
            await b.close();
            if(faults.length) {console.error('QA_FAIL: '+faults.join(' | '));process.exit(1);}
            console.log('QA_ALL_PASS: all rendered link hubs, 360/390/430/1280 px, no horizontal overflow, correct secure Notion CTA');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notion-viewport-screenshots
          path: qa-screenshots/
          retention-days: 7
