name: Serdar 26-language Comp Card candidate

on:
  push:
    branches: [test/serdar-26-comp-card-candidate-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated noindex candidate
        run: python3 scripts/build_serdar_26_candidate.py
      - name: Verify privacy, scope, locale and asset invariants
        run: python3 scripts/validate_serdar_26_candidate.py
      - name: Install local mobile browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Run 390 and 430 px local mobile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python3 scripts/serdar_26_candidate_mobile_qa.py
      - name: Install offline PDF verifier
        run: python3 -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Render all 26 A4 PDF candidates locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-26-candidate/pdfs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for code in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            out="serdar-26-candidate/pdfs/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=2500 \
              --print-to-pdf="$out" --no-pdf-header-footer \
              "http://127.0.0.1:8765/serdar-26-candidate/casting-card/${code}.html"
          done
      - name: Install PDF optimizer
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Compress PDFs for mobile delivery
        shell: bash
        run: |
          set -euo pipefail
          command -v gs
          for input in serdar-26-candidate/pdfs/*.pdf; do
            output="${input}.optimized"
            gs -q -sDEVICE=pdfwrite -dCompatibilityLevel=1.5 -dPDFSETTINGS=/ebook \
              -dNOPAUSE -dQUIET -dBATCH -sOutputFile="$output" "$input"
            mv "$output" "$input"
          done
      - name: Verify all 26 rendered PDFs
        run: python3 scripts/verify_serdar_26_candidate_pdfs.py
      - name: Keep mobile QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: serdar-26-candidate-mobile-qa
          path: serdar-26-candidate/mobile-qa/
          if-no-files-found: error
      - name: Prepare isolated noindex Cloudflare preview bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview-dist
          mkdir -p preview-dist/assets/photos
          cp -R serdar-26-candidate/casting-card preview-dist/casting-card
          cp assets/portfolio-qr.png preview-dist/assets/portfolio-qr.png
          for file in \
            serdar-armin-sargut-cocuk-oyuncu-model-portre-1536-v12-1-20260826.webp \
            serdar-armin-sargut-bej-takim-tam-boy.webp \
            serdar-armin-sargut-gri-takim-yelek.webp \
            serdar-armin-sargut-futbol-spor-portre.webp \
            serdar-armin-sargut-beyaz-tisort-lifestyle.webp
          do
            cp "assets/photos/$file" preview-dist/assets/photos/"$file"
          done
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  X-Content-Type-Options: nosniff\n' > preview-dist/_headers
      - name: Normalize Cloudflare account id for isolated preview
        id: cloudflare_account
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          account_id="$raw"
          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then
            account_id="${BASH_REMATCH[1]}"
          fi
          [[ "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy isolated noindex preview only
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare_account.outputs.account_id }}
          command: pages deploy preview-dist --project-name=serdararminsargut --branch=test-serdar-26-candidate
      - name: Verify isolated preview headers and routes
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.preview.outputs.deployment-url }}'
          test -n "$base"
          for code in tr ar ja; do
            passed=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --connect-timeout 8 --max-time 24 \
                -D /tmp/headers -o /tmp/body "$base/casting-card/$code.html" \
                && grep -Eiq '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' /tmp/headers \
                && grep -Fq 'TEST PREVIEW · NOINDEX' /tmp/body \
                && ! grep -Fq 'durumuallasargut' /tmp/body
              then
                passed=1
                break
              fi
              sleep 5
            done
            [[ "$passed" == 1 ]]
          done
          echo "SERDAR_26_NOINDEX_PREVIEW_PASS $base"
