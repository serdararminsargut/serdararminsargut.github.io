name: Serdar 26-language Comp Card candidate

on:
  push:
    branches: [test/serdar-26-comp-card-candidate-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated noindex candidate
        run: python3 scripts/build_serdar_26_candidate.py
      - name: Verify privacy, scope, locale and asset invariants
        run: python3 scripts/validate_serdar_26_candidate.py
      - name: Install local mobile browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Run 390 and 430 px local mobile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python3 scripts/serdar_26_candidate_mobile_qa.py
      - name: Install offline PDF verifier
        run: python3 -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Render all 26 A4 PDF candidates locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-26-candidate/pdfs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for code in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            out="serdar-26-candidate/pdfs/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=2500 \
              --print-to-pdf="$out" --no-pdf-header-footer \
              "http://127.0.0.1:8765/serdar-26-candidate/casting-card/${code}.html"
          done
      - name: Install PDF optimizer
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Compress PDFs for mobile delivery
        shell: bash
        run: |
          set -euo pipefail
          command -v gs
          for input in serdar-26-candidate/pdfs/*.pdf; do
            output="${input}.optimized"
            gs -q -sDEVICE=pdfwrite -dCompatibilityLevel=1.5 -dPDFSETTINGS=/ebook \
              -dNOPAUSE -dQUIET -dBATCH -sOutputFile="$output" "$input"
            mv "$output" "$input"
          done
      - name: Verify all 26 rendered PDFs
        run: python3 scripts/verify_serdar_26_candidate_pdfs.py
      - name: Keep mobile QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: serdar-26-candidate-mobile-qa
          path: serdar-26-candidate/mobile-qa/
          if-no-files-found: error
