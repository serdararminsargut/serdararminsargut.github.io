name: Serdar 26-language Comp Card candidate

on:
  push:
    branches: [test/serdar-26-comp-card-candidate-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build production-shaped locale sources without touching live routes
        run: python3 scripts/build_serdar_26_release_sources.py
      - name: Verify production-shaped source structure and isolation
        run: python3 scripts/validate_serdar_26_release_sources.py
      - name: Build the isolated noindex candidate
        run: python3 scripts/build_serdar_26_candidate.py
      - name: Verify privacy, scope, locale and asset invariants
        run: python3 scripts/validate_serdar_26_candidate.py
      - name: Install local mobile browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Run 390 and 430 px local mobile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          python3 scripts/serdar_26_candidate_mobile_qa.py
      - name: Run 390 and 430 px production-shaped source mobile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-release-source-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          SERDAR_26_SOURCE_DIR=serdar-26-release-sources/casting-card \
          SERDAR_26_QA_OUT=serdar-26-release-sources/mobile-qa \
          SERDAR_26_EXPECTED_ROBOTS=index,follow \
          python3 scripts/serdar_26_candidate_mobile_qa.py
      - name: Install offline PDF verifier
        run: python3 -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Render all 26 A4 PDF candidates locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-26-candidate/pdfs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/serdar-26-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for code in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            out="serdar-26-candidate/pdfs/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=2500 \
              --print-to-pdf="$out" --no-pdf-header-footer \
              "http://127.0.0.1:8765/serdar-26-candidate/casting-card/${code}.html"
          done
      - name: Render all 26 production-shaped source PDFs locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-26-release-sources/pdfs
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/serdar-26-release-source-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for code in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            out="serdar-26-release-sources/pdfs/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --run-all-compositor-stages-before-draw --virtual-time-budget=2500 \
              --print-to-pdf="$out" --no-pdf-header-footer \
              "http://127.0.0.1:8766/serdar-26-release-sources/casting-card/${code}.html"
          done
      - name: Install PDF optimizer
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Compress rendered PDFs for mobile delivery
        shell: bash
        run: |
          set -euo pipefail
          command -v gs
          for root in serdar-26-candidate serdar-26-release-sources; do
            for input in "$root"/pdfs/*.pdf; do
              output="${input}.optimized"
              gs -q -sDEVICE=pdfwrite -dCompatibilityLevel=1.5 -dPDFSETTINGS=/ebook \
                -dNOPAUSE -dQUIET -dBATCH -sOutputFile="$output" "$input"
              mv "$output" "$input"
            done
          done
      - name: Verify all 26 isolated candidate PDFs
        run: python3 scripts/verify_serdar_26_candidate_pdfs.py
      - name: Verify all 26 production-shaped source PDFs
        run: SERDAR_26_PDF_ROOT=serdar-26-release-sources SERDAR_26_PDF_LABEL=RELEASE_SOURCE python3 scripts/verify_serdar_26_candidate_pdfs.py
      - name: Build and verify 26-locale SHA-256 evidence package
        shell: bash
        run: |
          set -euo pipefail
          (
            cd serdar-26-release-sources
            mkdir -p evidence
            {
              find casting-card -maxdepth 1 -type f -name '*.html' -print0
              find pdfs -maxdepth 1 -type f -name '*.pdf' -print0
            } | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
            test "$(wc -l < evidence/SHA256SUMS)" -eq 52
            sha256sum -c evidence/SHA256SUMS
            tar --owner=0 --group=0 --numeric-owner -czf evidence/serdar-26-release-source-package.tar.gz \
              casting-card pdfs evidence/SHA256SUMS
            gzip -t evidence/serdar-26-release-source-package.tar.gz
            member_count=$(tar -tzf evidence/serdar-26-release-source-package.tar.gz | grep -E '^(casting-card/.*[.]html|pdfs/.*[.]pdf|evidence/SHA256SUMS)$' | wc -l)
            test "$member_count" -eq 53
            sha256sum evidence/serdar-26-release-source-package.tar.gz > evidence/ARCHIVE-SHA256SUM
            sha256sum -c evidence/ARCHIVE-SHA256SUM
          )
      - name: Keep mobile QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: serdar-26-candidate-mobile-qa
          path: serdar-26-candidate/mobile-qa/
          if-no-files-found: error
      - name: Keep production-shaped source QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: serdar-26-release-source-qa
          path: |
            serdar-26-release-sources/casting-card/
            serdar-26-release-sources/mobile-qa/
            serdar-26-release-sources/pdfs/
            serdar-26-release-sources/evidence/
          if-no-files-found: error
      - name: Prepare isolated noindex Cloudflare preview bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview-dist
          mkdir -p preview-dist/assets/photos
          cp -R serdar-26-candidate/casting-card preview-dist/casting-card
          cp -R serdar-26-candidate/pdfs preview-dist/pdfs
          cp assets/portfolio-qr.png preview-dist/assets/portfolio-qr.png
          for file in \
            serdar-armin-sargut-cocuk-oyuncu-model-portre-1536-v12-1-20260826.webp \
            serdar-armin-sargut-bej-takim-tam-boy.webp \
            serdar-armin-sargut-gri-takim-yelek.webp \
            serdar-armin-sargut-futbol-spor-portre.webp \
            serdar-armin-sargut-beyaz-tisort-lifestyle.webp
          do
            cp "assets/photos/$file" preview-dist/assets/photos/"$file"
          done
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n  X-Content-Type-Options: nosniff\n' > preview-dist/_headers
      - name: Normalize Cloudflare account id for isolated preview
        id: cloudflare_account
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          account_id="$raw"
          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then
            account_id="${BASH_REMATCH[1]}"
          fi
          [[ "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy isolated noindex preview only
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare_account.outputs.account_id }}
          command: pages deploy preview-dist --project-name=serdararminsargut --branch=test-serdar-26-candidate
      - name: Verify isolated preview headers and routes
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.preview.outputs.deployment-url }}'
          test -n "$base"
          for code in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            passed=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --connect-timeout 8 --max-time 24 \
                -D /tmp/headers -o /tmp/body "$base/casting-card/$code.html" \
                && grep -Eiq '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' /tmp/headers \
                && grep -Fq 'TEST PREVIEW · NOINDEX' /tmp/body \
                && ! grep -Fq 'durumuallasargut' /tmp/body
              then
                passed=1
                break
              fi
              sleep 5
            done
            [[ "$passed" == 1 ]]
            pdf="/tmp/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            curl -fsSL --connect-timeout 8 --max-time 24 \
              -D /tmp/pdf-headers -o "$pdf" "$base/pdfs/Serdar-Armin-Sargut-Comp-Card-${code^^}.pdf"
            grep -Eiq '^content-type:[[:space:]]*application/pdf([;[:space:]]|$)' /tmp/pdf-headers
            head -c 4 "$pdf" | grep -Fq '%PDF'
          done
          echo "SERDAR_26_NOINDEX_PREVIEW_PASS $base"
