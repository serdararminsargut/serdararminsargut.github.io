name: Serdar live release read-only proof
on:
  push:
    branches: ['test/serdar-seo-live-proof-20261107']
    paths: ['.github/workflows/serdar-seo-live-proof-20261107.yml']
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install 'playwright==1.63.0' 'lxml>=5,<7'
          python -m playwright install --with-deps chromium
      - name: Verify live deployment without writes
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from lxml import html,etree
          from playwright.sync_api import sync_playwright
          import hashlib,json,time
          base='https://serdararminsargut.com'
          def fetch(path):
              with urlopen(Request(base+path,headers={'User-Agent':'Mozilla/5.0 SerdarReleaseVerification/1.0','Cache-Control':'no-cache'}),timeout=30) as r:
                  return {'status':r.status,'url':r.geturl(),'content_type':r.headers.get('Content-Type',''),'data':r.read()}
          results={'candidate_commit':'41e7b98ca9c1dc78f5ca5334a25b44677cf10f1b','production_merge_commit':'869e68f1bdb984cfbeaf348a622eabc274e50608','routes':{},'browsers':[],'errors':[]}
          try:
              for path in ['/','/en/','/ar/','/ru/','/az/','/kk/','/uz/','/ky/','/robots.txt','/sitemap.xml','/assets/css/home-tr-desktop-20261107.css']:
                  response=fetch(path)
                  results['routes'][path]={'status':response['status'],'final_url':response['url'],'content_type':response['content_type']}
                  assert response['status']==200 and response['url'].startswith(base+'/'),(path,response)
                  if path=='/':
                      d=html.fromstring(response['data'])
                      assert 'Çocuk Oyuncu ve Model' in d.xpath('string(//title)')
                      assert d.xpath('//nav//a[@data-comp-card-link="nav"]/@href')==['/casting-card/tr.html']
                      assert d.xpath('//link[contains(@href,"home-tr-desktop-20261107.css")]')
                  elif path[1:-1] in ['en','ar','ru','az','kk','uz','ky']:
                      lang=path.strip('/')
                      d=html.fromstring(response['data'])
                      assert d.xpath('//nav//a[@data-comp-card-link="nav"]/@href')==['/casting-card/'+lang]
                      assert d.xpath('//script[@src="/assets/js/locale-interactions-'+lang+'-20261107.js"]')
                  elif path=='/robots.txt':
                      assert b'sitemap' in response['data'].lower()
                  elif path=='/sitemap.xml':
                      xml=etree.fromstring(response['data'])
                      loc=xml.xpath('//*[local-name()="loc"]/text()')
                      assert len([x for x in loc if '/casting-card/' in x])==26
                      results['sitemap_url_count']=len(loc)
                  elif path.endswith('.css'):
                      local=Path(path.lstrip('/')).read_bytes()
                      assert hashlib.sha256(local).digest()==hashlib.sha256(response['data']).digest()
              for lang in ['TR','EN']:
                  p='/downloads/Serdar-Armin-Sargut-Comp-Card-'+lang+'.pdf'
                  r=fetch(p)
                  expected=hashlib.sha256(Path(p.lstrip('/')).read_bytes()).hexdigest()
                  actual=hashlib.sha256(r['data']).hexdigest()
                  results['routes'][p]={'status':r['status'],'content_type':r['content_type'],'sha256_match':expected==actual}
                  assert r['status']==200 and expected==actual,(lang,'pdf')
              with sync_playwright() as p:
                  browser=p.chromium.launch(args=['--no-sandbox'])
                  for session in ['normal','clean']:
                      context=browser.new_context(viewport={'width':390,'height':844})
                      context.route('**/*',lambda r:r.continue_() if r.request.url.startswith(base+'/') else r.abort())
                      page=context.new_page()
                      for width in [390,1280]:
                          page.set_viewport_size({'width':width,'height':844})
                          response=page.goto(base+'/',wait_until='load',timeout=45000)
                          assert response and response.status==200
                          assert page.locator('.hero-media img').evaluate('x=>x.complete && x.naturalWidth>0')
                          assert page.locator('nav a[data-comp-card-link="nav"]').is_visible()
                          assert page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+1')
                          response=page.goto(base+'/en/',wait_until='load',timeout=45000)
                          assert response and response.status==200
                          page.locator('[data-lightbox]:not([data-instagram-tile="true"])').first.click(timeout=15000)
                          assert page.locator('.lightbox.open').count()==1,(session,width,'gallery')
                          page.locator('.lightbox button').click()
                          assert page.locator('nav a[data-comp-card-link="nav"]').get_attribute('href')=='/casting-card/en'
                          row={'session':session,'width':width,'result':'PASS'}
                          results['browsers'].append(row)
                          print('LIVE_BROWSER',session,width,'PASS',flush=True)
                      context.close()
                  browser.close()
          except Exception as e:
              results['errors'].append(str(e)[:1000])
              print('LIVE_ERROR',str(e)[:1000],flush=True)
          Path('live-release-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf8')
          assert not results['errors'] and len(results['browsers'])==4,results['errors']
          print('LIVE_RELEASE_LOCAL_PASS',flush=True)
          PY
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-seo-live-proof
          path: live-release-results.json
          retention-days: 14
          if-no-files-found: warn
