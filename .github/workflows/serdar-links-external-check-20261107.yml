name: Read external link destinations
on:
  push:
    branches: ['test/serdar-links-external-check-20261107']
    paths: ['.github/workflows/serdar-links-external-check-20261107.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request, urllib.error
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('data-key') in ('linkedin','vimeo','behance','tiktok','substack','wordpress','blogger','linktree'):
                      self.urls.append((a['data-key'],a['href']))
          p=Parser();p.feed(Path('links/index.html').read_text())
          for key,url in p.urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print('LINK',key,'HTTP',r.status,'FINAL',r.geturl(),flush=True)
              except Exception as e:
                  print('UNVERIFIED',key,type(e).__name__,str(e)[:120],flush=True)
          PY
