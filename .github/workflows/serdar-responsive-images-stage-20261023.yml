name: Serdar responsive images staging apply (test branch only)
on:
  push:
    branches: [test/serdar-sitejs-defer-20261023]
    paths: ['.github/workflows/serdar-responsive-images-stage-20261023.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  apply:
    if: github.ref == 'refs/heads/test/serdar-sitejs-defer-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/serdar-sitejs-defer-20261023
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: serdar-responsive-webp-candidates-evidence
          run-id: 40001198275
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/serdar-candidates
      - name: Verify candidates and prepare minimal changes
        run: |
          set -euo pipefail
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          root=Path('assets/photos')
          content=Path('index.html').read_text()
          stems=['serdar-armin-sargut-set-kamera-arkasi','serdar-armin-sargut-gri-takim-yelek','serdar-armin-sargut-siyah-moda-yakin-plan']
          for stem in stems:
            original=root/f'{stem}.webp'
            assert original.is_file(),stem
            with Image.open(original) as img: ow=img.width
            assert ow>640,(stem,ow)
            for width in (320,640):
              source=Path('/tmp/serdar-candidates/candidates')/f'{stem}-{width}.webp'
              assert source.is_file(),str(source)
              with Image.open(source) as img:
                assert img.format=='WEBP' and img.width==width,(source,img.size)
              dest=root/source.name
              assert not dest.exists(),f'Would overwrite: {dest}'
              shutil.copy2(source,dest)
            old=f'src="/assets/photos/{stem}.webp"'
            assert content.count(old)==3,(stem,content.count(old))
            new=f'src="/assets/photos/{stem}.webp" srcset="/assets/photos/{stem}-320.webp 320w, /assets/photos/{stem}-640.webp 640w, /assets/photos/{stem}.webp {ow}w" sizes="(max-width: 640px) 45vw, 640px"'
            content=content.replace(old,new)
          Path('index.html').write_text(content)
          PY
          git diff --check
          git status --short
          git diff --stat
      - name: Commit only approved Serdar test changes
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "test/serdar-sitejs-defer-20261023"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html assets/photos/serdar-armin-sargut-set-kamera-arkasi-320.webp assets/photos/serdar-armin-sargut-set-kamera-arkasi-640.webp assets/photos/serdar-armin-sargut-gri-takim-yelek-320.webp assets/photos/serdar-armin-sargut-gri-takim-yelek-640.webp assets/photos/serdar-armin-sargut-siyah-moda-yakin-plan-320.webp assets/photos/serdar-armin-sargut-siyah-moda-yakin-plan-640.webp
          git diff --cached --check
          git commit -m "test: add three responsive photo pairs and srcset"
          git push origin HEAD:refs/heads/test/serdar-sitejs-defer-20261023
