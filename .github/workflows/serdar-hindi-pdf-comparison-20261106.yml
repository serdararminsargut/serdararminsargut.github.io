name: Serdar Hindi PDF production comparison no deploy
on:
  push:
    branches: ['test/serdar-compact-local-qa-20261106']
    paths: ['.github/workflows/serdar-hindi-pdf-comparison-20261106.yml']
permissions:
  contents: read
jobs:
  local-pdf-comparison:
    if: github.repository == 'serdararminsargut/serdararminsargut.github.io' && github.ref == 'refs/heads/test/serdar-compact-local-qa-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-only PDF tools
        run: |
          python -m pip install 'playwright==1.63.0' 'pypdf>=5,<7' 'Pillow>=10,<13'
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils ghostscript qpdf zbar-tools fonts-freefont-ttf fonts-wqy-zenhei
          fc-cache -f
      - name: Generate and inspect PDF options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hindi-evidence
          python -m http.server 8767 --bind 127.0.0.1 >/tmp/serdar-hindi-local.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import json
          from urllib.parse import unquote,urlsplit
          from PIL import Image
          from playwright.sync_api import sync_playwright
          root=Path('.').resolve()
          cache={}
          def route_handler(route):
              url=route.request.url
              if not url.startswith('http://127.0.0.1:8767/'):
                  route.abort(); return
              path=unquote(urlsplit(url).path).lstrip('/')
              if path.startswith('assets/photos/') and path.lower().endswith(('.webp','.jpeg','.jpg','.png')):
                  f=(root/path).resolve()
                  if not f.is_relative_to(root) or not f.is_file(): raise ValueError('invalid local photo')
                  if f not in cache:
                      with Image.open(f) as src:
                          img=src.convert('RGB')
                          img.thumbnail((1400,1400),Image.Resampling.LANCZOS)
                          out=BytesIO()
                          img.save(out,'JPEG',quality=82,subsampling=0,optimize=True)
                          cache[f]=out.getvalue()
                  route.fulfill(status=200,body=cache[f],content_type='image/jpeg')
              else:
                  route.continue_()
          with sync_playwright() as pw:
              browser=pw.chromium.launch(args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1280,'height':900})
              page.route('**/*',route_handler)
              response=page.goto('http://127.0.0.1:8767/casting-card/hi.html',wait_until='load',timeout=30000)
              assert response and response.status==200
              assert page.evaluate("document.fonts.ready.then(()=>[...document.images].every(i=>i.complete && i.naturalWidth>0))")
              facts=page.locator('.fact strong').all_text_contents()
              header=page.locator('.info .eyebrow').inner_text()
              (Path('hindi-evidence')/'expected.json').write_text(json.dumps({'facts':facts,'header':header},ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              page.pdf(path='hindi-evidence/HI-raw.pdf',format='A4',prefer_css_page_size=True,print_background=True,display_header_footer=False)
              page.close();browser.close()
          PY
          gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -sOutputFile=hindi-evidence/HI-gs.pdf hindi-evidence/HI-raw.pdf
          qpdf --object-streams=generate --stream-data=compress hindi-evidence/HI-raw.pdf hindi-evidence/HI-qpdf.pdf
          for name in raw gs qpdf; do
            pdftotext "hindi-evidence/HI-$name.pdf" "hindi-evidence/$name.txt"
            pdftoppm -f 1 -l 1 -scale-to 1800 -png -singlefile "hindi-evidence/HI-$name.pdf" "hindi-evidence/$name"
            decoded=$(zbarimg --quiet --raw "hindi-evidence/$name.png" 2>/dev/null || true)
            test "$decoded" = 'https://serdararminsargut.com/'
          done
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import json,unicodedata
          p=Path('hindi-evidence')
          expected=json.loads((p/'expected.json').read_text(encoding='utf8'))
          def n(s):
              return ''.join(c for c in unicodedata.normalize('NFC',s) if not c.isspace() and c not in '\u200e\u200f\u202a\u202b\u202c\u200c').casefold()
          checks={}
          for code in ('raw','gs','qpdf'):
              f=p/('HI-'+code+'.pdf')
              doc=PdfReader(str(f))
              content=n((p/(code+'.txt')).read_text(encoding='utf8'))
              checks[code]={'bytes':f.stat().st_size,'pages':len(doc.pages),'facts_exact':[n(x) in content for x in expected['facts']], 'header_exact':n(expected['header']) in content, 'annotations':len(doc.pages[0].get('/Annots',[])),'qr':'PASS'}
              print(code,json.dumps(checks[code],ensure_ascii=False),flush=True)
              assert len(doc.pages)==1
          (p/'comparison.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2)+'\n')
          print('TEST_ONLY_NO_DEPLOY',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serdar-hindi-pdf-comparison
          path: hindi-evidence/
          retention-days: 7
          if-no-files-found: warn
