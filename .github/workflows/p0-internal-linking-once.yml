name: P0 internal linking once

on:
  push:
    paths:
      - '.github/workflows/p0-internal-linking-once.yml'

permissions:
  contents: write

jobs:
  update-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add internal links to 16 P0 pages
        shell: python
        run: |
          from pathlib import Path
          import re
          groups=[{'tr':'/erkek-cocuk-model/','en':'/en/boy-model/','ar':'/ar/model-walad/','ru':'/ru/model-malchik/'},{'tr':'/spor-giyim-cocuk-modeli/','en':'/en/kids-sportswear-model/','ar':'/ar/model-atfal-malabis-riyadiya/','ru':'/ru/detskaya-sportivnaya-model/'},{'tr':'/cocuk-giyim-modeli/','en':'/en/kidswear-model/','ar':'/ar/model-atfal-malabis/','ru':'/ru/model-detskoy-odezhdy/'},{'tr':'/e-ticaret-cocuk-modeli/','en':'/en/ecommerce-child-model/','ar':'/ar/model-atfal-tijara-elektroniya/','ru':'/ru/model-dlya-internet-magazina/'}]
          files={'tr':['erkek-cocuk-model/index.html','spor-giyim-cocuk-modeli/index.html','cocuk-giyim-modeli/index.html','e-ticaret-cocuk-modeli/index.html'],'en':['en/boy-model/index.html','en/kids-sportswear-model/index.html','en/kidswear-model/index.html','en/ecommerce-child-model/index.html'],'ar':['ar/model-walad/index.html','ar/model-atfal-malabis-riyadiya/index.html','ar/model-atfal-malabis/index.html','ar/model-atfal-tijara-elektroniya/index.html'],'ru':['ru/model-malchik/index.html','ru/detskaya-sportivnaya-model/index.html','ru/model-detskoy-odezhdy/index.html','ru/model-dlya-internet-magazina/index.html']}
          labels={'tr':{'heading':'İlgili Portföy Sayfaları','intro':'Projenize en uygun portföy alanını inceleyin:','p0':['Erkek Çocuk Model','Spor Giyim Çocuk Modeli','Çocuk Giyim Modeli','E-Ticaret Çocuk Modeli'],'home':'Ana Portföy','card':'Comp Card','showreel':'Showreel'},'en':{'heading':'Related Portfolio Pages','intro':'Explore the portfolio section most relevant to your project:','p0':['Boy Model','Kids Sportswear Model','Kidswear Model','E-Commerce Child Model'],'home':'Main Portfolio','card':'Comp Card','showreel':'Showreel'},'ar':{'heading':'صفحات البورتفوليو ذات الصلة','intro':'استعرض قسم البورتفوليو الأنسب لمشروعك:','p0':['موديل ولد','موديل ملابس رياضية للأطفال','موديل ملابس أطفال','موديل للتجارة الإلكترونية'],'home':'البورتفوليو الرئيسي','card':'الكومب كارد','showreel':'الشوريل'},'ru':{'heading':'Связанные страницы портфолио','intro':'Выберите раздел портфолио, наиболее подходящий для проекта:','p0':['Модель-мальчик','Детская спортивная одежда','Детская одежда','E-commerce модель'],'home':'Главное портфолио','card':'Comp Card','showreel':'Showreel'}}
          start='<!-- P0_INTERNAL_LINKS_START -->'; end='<!-- P0_INTERNAL_LINKS_END -->'
          canonical_re=re.compile(r'<link\s+rel="canonical"\s+href="[^"]+"\s*/?>'); hreflang_re=re.compile(r'<link\s+rel="alternate"\s+hreflang="(?:tr|en|ar|ru|x-default)"\s+href="[^"]+"\s*/?>')
          changed=[]
          for lang,lang_files in files.items():
              for idx,rel in enumerate(lang_files):
                  path=Path(rel); original=path.read_text(encoding='utf-8')
                  if start in original or end in original: raise SystemExit(f'Marker exists: {rel}')
                  if '</main>' not in original: raise SystemExit(f'No main close: {rel}')
                  cb=canonical_re.findall(original); hb=hreflang_re.findall(original)
                  if len(cb)!=1 or len(hb)!=5: raise SystemExit(f'SEO invariant failed: {rel}; canon={len(cb)} hreflang={len(hb)}')
                  siblings=[f'<a href="{group[lang]}">{labels[lang]["p0"][j]}</a>' for j,group in enumerate(groups) if j!=idx]
                  block=f'\n{start}\n<section class="p0-related-links" aria-label="{labels[lang]["heading"]}">\n<h2>{labels[lang]["heading"]}</h2>\n<p>{labels[lang]["intro"]}</p>\n<p>{" · ".join(siblings)}</p>\n<p><a href="/">{labels[lang]["home"]}</a> · <a href="/casting-card/v2/">{labels[lang]["card"]}</a> · <a href="/showreel/">{labels[lang]["showreel"]}</a></p>\n</section>\n{end}\n'
                  updated=original.replace('</main>',block+'</main>',1)
                  if canonical_re.findall(updated)!=cb or hreflang_re.findall(updated)!=hb: raise SystemExit(f'SEO metadata changed: {rel}')
                  if updated.replace(block,'',1)!=original: raise SystemExit(f'Unexpected modification: {rel}')
                  path.write_text(updated,encoding='utf-8'); changed.append(rel)
          if len(changed)!=16: raise SystemExit(f'Expected 16, got {len(changed)}')
          print('Updated 16 P0 pages')

      - name: Commit update and remove one-time workflow
        run: |
          rm .github/workflows/p0-internal-linking-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: strengthen internal links across 16 P0 pages"
          git push
