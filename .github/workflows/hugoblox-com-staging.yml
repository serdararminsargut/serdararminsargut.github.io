name: Serdar HugoBlox /rehber/ integration STAGING — no production

on:
  push:
    branches:
      - test/hugoblox-com-integration-20261030
    paths:
      - 'scripts/portfolio_autosync_preview.py'
      - 'data/autosync/**'
      - '.github/workflows/hugoblox-com-staging.yml'
      - 'experiments/hugoblox-20261029/**'
      - 'scripts/hugoblox_stage_overlay.py'
      - 'scripts/hugoblox_prepare_release_candidate.py'
      - 'scripts/hugoblox_compiled_mobile_qa.py'
      - 'scripts/hugoblox_mobile_layout_probe_v18.html'

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: hugoblox-serdar-com-staging-v14
  cancel-in-progress: true

jobs:
  staging:
    if: github.ref == 'refs/heads/test/hugoblox-com-integration-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Assemble exact existing portfolio and editorial static routes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'test/hugoblox-com-integration-20261030'
          mkdir -p dist
          for item in .nojekyll _headers _redirects 404.html ai.txt ar assets az blog card.html casting-card cocuk-giyim-modeli de downloads en fa favicon.svg favicon.ico favicon-96x96.png fr index.html indexnow-key.txt 72f0dad836e29ffcc2d9dd42a794dbf0.txt erkek-cocuk-model e-ticaret-cocuk-modeli it kk ky llms.txt llms-full.txt links postcard.html projeler rehber robots.txt ru sitemap.xml sitemap-google.xml sitemap.txt spor-giyim-cocuk-modeli tk uz zh-cn yandex_*.html; do
            for match in $item; do
              if [ -e "$match" ]; then cp -a "$match" dist/; fi
            done
          done
          test -s dist/index.html
          test -s dist/blog/index.html
          test -s dist/rehber/korfez-cocuk-model-portfoyu/index.html
          test -s dist/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/index.html
          sha256sum dist/index.html dist/blog/index.html dist/rehber/korfez-cocuk-model-portfoyu/index.html dist/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/index.html > /tmp/serdar-stage-baseline.sha
          # Snapshot EVERY copied static asset and existing published route before
          # the HugoBlox overlay; the only intentional global preview changes are
          # robots, headers and preview sitemap removal.
          find dist -type f \
            ! -name 'robots.txt' ! -name '_headers' \
            ! -name 'sitemap.xml' ! -name 'sitemap-google.xml' \
            -print0 | sort -z | xargs -0 -r sha256sum > /tmp/serdar-all-routes-before.sha
          test -s /tmp/serdar-all-routes-before.sha
      - name: Build HugoBlox isolated drafts to secure output
        working-directory: experiments/hugoblox-20261029
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:test
          python3 scripts/verify_turkish_ui.py public
      - name: Mount HugoBlox under /rehber/ without replacing portfolio
        run: |
          set -euo pipefail
          python3 scripts/hugoblox_stage_overlay.py --site-root dist --hugo-root experiments/hugoblox-20261029/public
          cp scripts/hugoblox_staging_qa_v14.html dist/__qa_integration_v14.html
          cp scripts/hugoblox_mobile_css_probe_v17.html dist/__qa_mobile_css_v17.html
          cp scripts/hugoblox_mobile_layout_probe_v18.html dist/__qa_mobile_layout_v18.html
          grep -Fq 'V18_LAYOUT_GATE=' dist/__qa_mobile_layout_v18.html
          grep -Fq 'noindex,nofollow,noarchive' dist/__qa_integration_v14.html
          sha256sum --check /tmp/serdar-stage-baseline.sha
          sha256sum --check /tmp/serdar-all-routes-before.sha
          test -s dist/rehber/korfez-cocuk-model-portfoyu/index.html
          test -s dist/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/index.html
          echo 'SERDAR_HUGOBLOX_EXISTING_ROUTES_SHA_PASS: all original copied routes/assets preserved'
          test -s dist/rehber/index.html
          # Acceptance: the compiled HugoBlox homepage must offer the real official conversion paths.
          grep -Fq 'https://serdararminsargut.com/' dist/rehber/index.html
          grep -Fq 'https://serdararminsargut.com/casting-card/tr.html' dist/rehber/index.html
          grep -Fq 'https://www.instagram.com/serdararminsargutt/' dist/rehber/index.html
          echo 'HUGOBLOX_SERDAR_CONVERSION_LINKS_PASS: official portfolio, casting card and Instagram'
          test -s dist/rehber/post/index.html
          test "$(find dist/rehber/post -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 3
          grep -Fq 'Disallow: /' dist/robots.txt
          grep -Fq 'X-Robots-Tag: noindex' dist/_headers
          test ! -e dist/sitemap.xml
      - name: Refresh serdar live-source snapshot in restricted HugoBlox Preview
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/portfolio_autosync_preview.py --project serdar --root dist
          test -s dist/rehber/portfoy-guncel/source-status.json
          grep -Fq 'noindex,nofollow,noarchive' dist/rehber/portfoy-guncel/index.html
          echo 'AUTOSYNC PREVIEW SNAPSHOT GENERATED (not a production publication)'
      - name: Local Chromium acceptance of compiled HugoBlox (NO external Preview)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0'
          python3 -m playwright install chromium
          mkdir -p qa-artifacts
          python3 -m http.server 8769 --bind 127.0.0.1 --directory dist > qa-artifacts/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/rehber/ -o /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/hugoblox_compiled_mobile_qa.py --url http://127.0.0.1:8769/ --output qa-artifacts/hugoblox
      - name: Store local-only Chromium measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-hugoblox-local-chromium-qa
          path: qa-artifacts/
          retention-days: 3
          if-no-files-found: warn
      - name: Offline Serdar SEO release candidate acceptance - NO DEPLOY
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'test/hugoblox-com-integration-20261030'
          candidate_tmp="$(mktemp -d)"
          trap 'rm -rf "$candidate_tmp"' EXIT
          python3 scripts/hugoblox_prepare_release_candidate.py \
            --staging-root dist --output-root "$candidate_tmp/serdar-release"
          python3 - "$candidate_tmp/serdar-release/manifest.json" <<'PY_RELEASE'
          import json
          import sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert m['project']=='SERDAR_ONLY'
          assert m['status']=='OFFLINE_CANDIDATE_NOT_PUBLISHED'
          assert m['production_publish_authorized'] is False
          assert m['new_guide_pages']==5 and m['new_articles']==3
          assert m['existing_regional_pages_preserved_in_source']==2
          assert m['existing_locale_homepages_preserved_in_source']==8
          assert m['serdar_26_locale_expansion_included'] is False
          assert m['diagnostic_routes_included'] is False
          assert m['sitemap_merged_into_production'] is False
          print('SERDAR_OFFLINE_RELEASE_MANIFEST_PASS: no publication or sitemap mutation')
          PY_RELEASE
      - name: Validate Cloudflare secret account identifier
        id: cf
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN"
          account_id="$CF_ACCOUNT"
          if [[ "$account_id" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then account_id="${BASH_REMATCH[1]}"; fi
          [[ "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
      - name: Deploy only restricted Cloudflare Preview branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy dist --project-name=serdararminsargut --branch=test/hugoblox-com-integration-20261030
