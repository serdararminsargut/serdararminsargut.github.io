name: Serdar mobile image loading audit (test only)
on:
  push:
    branches: [test/serdar-sitejs-defer-20261023]
    paths: ['.github/workflows/serdar-mobile-image-loading-20261023.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/test/serdar-sitejs-defer-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Run isolated noindex server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-image-audit-evidence
          cat > /tmp/serdar-image-server.py <<'PY'
          import http.server
          class Handler(http.server.SimpleHTTPRequestHandler):
            def end_headers(self):
              self.send_header('X-Robots-Tag','noindex, nofollow, noarchive')
              super().end_headers()
            def do_GET(self):
              if self.path.split('?')[0]=='/robots.txt':
                body=b'User-agent: *\nDisallow: /\n'
                self.send_response(200)
                self.send_header('Content-Type','text/plain')
                self.send_header('Content-Length',str(len(body)))
                self.end_headers()
                self.wfile.write(body)
              else: super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1',8765),Handler).serve_forever()
          PY
          python3 /tmp/serdar-image-server.py >/tmp/serdar-image-server.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 1; done
          curl -fsSI http://127.0.0.1:8765/ | grep -iq 'x-robots-tag: noindex'
          curl -fsS http://127.0.0.1:8765/robots.txt | grep -Fxq 'Disallow: /'
          sha256sum index.html assets/css/site.css assets/js/site.js > serdar-image-audit-evidence/source-sha256.txt
      - name: Measure image requests before and after scrolling
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          cat > /tmp/serdar-image-audit.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const results=[];
            const targets=['serdar-armin-sargut-kahverengi-takim-oturan.webp','serdar-armin-sargut-set-kamera-arkasi.webp','serdar-armin-sargut-futbol-spor-portre.webp'];
            for(const width of [360,390,430]){
              const context=await browser.newContext({viewport:{width,height:780},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const requests=[];
              page.on('request',req=>{if(req.url().includes('/assets/photos/'))requests.push({url:req.url().split('/').pop(),time:Date.now()});});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'load',timeout:30000});
              await page.waitForTimeout(2500);
              const before=requests.map(x=>x.url);
              const positions=await page.locator('img').evaluateAll(els=>els.filter(e=>e.src.includes('/assets/photos/')).map(e=>({name:e.currentSrc.split('/').pop(),loading:e.loading,top:Math.round(e.getBoundingClientRect().top)})));
              await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,100));}});
              await page.waitForTimeout(1800);
              const after=requests.map(x=>x.url);
              results.push({width,before,after,targets:targets.map(name=>({name,requested_before:before.includes(name),requested_after:after.includes(name),position:positions.find(p=>p.name===name)||null})),errors,overflow:await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth)});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('serdar-image-audit-evidence/summary.json',JSON.stringify({scope:'isolated localhost mobile audit, no production changes',results},null,2));
            console.log(JSON.stringify(results.map(r=>({width:r.width,targets:r.targets,errors:r.errors,overflow:r.overflow})),null,2));
            if(results.some(r=>r.errors.length||r.overflow))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node /tmp/serdar-image-audit.cjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-mobile-image-loading-evidence
          path: serdar-image-audit-evidence/
          retention-days: 14
