name: P0 Live HTTP Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify four Turkish P0 production URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://serdararminsargut.pages.dev/erkek-cocuk-model/"
            "https://serdararminsargut.pages.dev/cocuk-giyim-modeli/"
            "https://serdararminsargut.pages.dev/spor-giyim-cocuk-modeli/"
            "https://serdararminsargut.pages.dev/e-ticaret-cocuk-modeli/"
          )

          for url in "${urls[@]}"; do
            echo "============================================================"
            echo "REQUEST_URL=$url"
            headers="$(mktemp)"
            body="$(mktemp)"

            curl --fail-with-body --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --dump-header "$headers" --output "$body" \
              --write-out 'HTTP_CODE=%{http_code}\nFINAL_URL=%{url_effective}\n' \
              "$url"

            canonical="$(grep -Eio '<link[^>]+rel=["'"']canonical["'"'][^>]*>|<link[^>]+href=["'"'][^"'"']+["'"'][^>]+rel=["'"']canonical["'"'][^>]*>' "$body" | head -n1 | grep -Eio 'href=["'"'][^"'"']+["'"']' | sed -E 's/^href=["'"']|["'"']$//g' || true)"
            echo "CANONICAL=${canonical:-MISSING}"
            echo "FINAL_RESPONSE_STATUS=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$headers")"

            rm -f "$headers" "$body"
          done
