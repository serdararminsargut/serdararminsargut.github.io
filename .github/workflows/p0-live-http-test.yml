name: P0 Live HTTP Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify four Turkish P0 production URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://serdararminsargut.pages.dev/erkek-cocuk-model/"
            "https://serdararminsargut.pages.dev/cocuk-giyim-modeli/"
            "https://serdararminsargut.pages.dev/spor-giyim-cocuk-modeli/"
            "https://serdararminsargut.pages.dev/e-ticaret-cocuk-modeli/"
          )
          for url in "${urls[@]}"; do
            echo "============================================================"
            echo "REQUEST_URL=$url"
            body="$(mktemp)"
            result="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "$body" --write-out 'HTTP_CODE=%{http_code} FINAL_URL=%{url_effective}' "$url")"
            echo "$result"
            canonical="$(python3 -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8",errors="replace").read(); m=re.search(r"<link[^>]*rel=[\"'\"']canonical[\"'\"'][^>]*href=[\"'\"']([^\"'\"']+)[\"'\"']|<link[^>]*href=[\"'\"']([^\"'\"']+)[\"'\"'][^>]*rel=[\"'\"']canonical[\"'\"']",s,re.I); print((m.group(1) or m.group(2)) if m else "MISSING")' "$body")"
            echo "CANONICAL=$canonical"
            rm -f "$body"
          done
