name: P0 Live HTTP Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify four Turkish P0 production URLs
        shell: bash
        run: |
          set -u
          urls=(
            "https://serdararminsargut.com/erkek-cocuk-model/"
            "https://serdararminsargut.com/cocuk-giyim-modeli/"
            "https://serdararminsargut.com/spor-giyim-cocuk-modeli/"
            "https://serdararminsargut.com/e-ticaret-cocuk-modeli/"
          )
          for url in "${urls[@]}"; do
            echo "============================================================"
            echo "REQUEST_URL=$url"
            body="$(mktemp)"
            curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output "$body" --write-out 'HTTP_CODE=%{http_code}\nFINAL_URL=%{url_effective}\n' "$url"
            canonical_line="$(grep -i -m1 'rel="canonical"' "$body" || true)"
            canonical="$(printf '%s\n' "$canonical_line" | sed -n 's/.*href="\([^"]*\)".*/\1/p')"
            echo "CANONICAL=${canonical:-MISSING}"
            rm -f "$body"
          done
