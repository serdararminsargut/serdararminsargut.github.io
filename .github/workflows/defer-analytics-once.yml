name: Defer analytics once

on:
  push:
    paths:
      - '.github/workflows/defer-analytics-once.yml'

permissions:
  contents: write

jobs:
  defer-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Defer third-party analytics until after first load
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          gtag_tag = '<script defer src="https://www.googletagmanager.com/gtag/js?id=G-H894LKL93J"></script>\n'
          if html.count(gtag_tag) != 1:
              raise SystemExit(f'Expected one external gtag tag, found {html.count(gtag_tag)}')
          html = html.replace(gtag_tag, '', 1)
          index.write_text(html, encoding='utf-8')

          analytics = Path('assets/js/analytics.js')
          old = analytics.read_text(encoding='utf-8')
          new = r'''/* Analytics bootstrap: queues events immediately; third-party libraries load after first render. */
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-H894LKL93J');

/* Yandex.Metrika queue is available immediately. */
window.ym = window.ym || function(){(window.ym.a=window.ym.a||[]).push(arguments)};
window.ym.l = 1*new Date();
ym(112473942, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});

(function(){
  let loaded=false;
  const loadThirdParty=()=>{
    if(loaded) return;
    loaded=true;

    const ga=document.createElement('script');
    ga.async=true;
    ga.src='https://www.googletagmanager.com/gtag/js?id=G-H894LKL93J';
    document.head.appendChild(ga);

    const ymScript=document.createElement('script');
    ymScript.async=true;
    ymScript.src='https://mc.yandex.ru/metrika/tag.js?id=112473942';
    document.head.appendChild(ymScript);
  };

  const schedule=()=>{
    if('requestIdleCallback' in window){
      requestIdleCallback(loadThirdParty,{timeout:2500});
    }else{
      setTimeout(loadThirdParty,1200);
    }
  };

  if(document.readyState==='complete') schedule();
  else window.addEventListener('load',schedule,{once:true});
})();
'''
          analytics.write_text(new, encoding='utf-8')

      - name: Commit change and remove one-time workflow
        run: |
          rm .github/workflows/defer-analytics-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: defer third-party analytics until after first render"
          git push
