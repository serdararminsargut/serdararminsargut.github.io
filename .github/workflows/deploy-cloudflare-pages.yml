name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-serdararminsargut
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy serdararminsargut.pages.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate canonical sitemap before deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          canonical_prefix = 'https://serdararminsargut.pages.dev/'
          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

          if root.tag != '{http://www.sitemaps.org/schemas/sitemap/0.9}urlset':
              raise SystemExit(f'Unexpected sitemap root: {root.tag}')

          urls = root.findall('sm:url', ns)
          if not urls:
              raise SystemExit('Sitemap contains no URLs')

          locs = []
          for node in urls:
              loc = node.find('sm:loc', ns)
              value = (loc.text or '').strip() if loc is not None else ''
              if not value.startswith(canonical_prefix):
                  raise SystemExit(f'Invalid sitemap location: {ET.tostring(node, encoding="unicode")}')
              locs.append(value)

          if len(locs) != len(set(locs)):
              raise SystemExit('Duplicate URLs found in sitemap.xml')

          print(f'Validated canonical sitemap.xml with {len(locs)} URLs')
          PY

      - name: Prepare static site bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          for item in \
            .nojekyll \
            _headers \
            404.html \
            ai.txt \
            ar \
            assets \
            az \
            blog \
            card.html \
            casting-card \
            en \
            favicon.svg \
            index.html \
            indexnow-key.txt \
            kk \
            ky \
            llms.txt \
            llms-full.txt \
            postcard.html \
            rehber \
            robots.txt \
            ru \
            sitemap.xml \
            sitemap-google.xml \
            sitemap.txt \
            uz \
            yandex_*.html
          do
            if compgen -G "$item" > /dev/null; then
              cp -R $item dist/
            elif [ -e "$item" ]; then
              cp -R "$item" dist/
            fi
          done

      - name: Normalize Cloudflare account id
        id: cloudflare_account
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          account_id="$raw"

          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then
            account_id="${BASH_REMATCH[1]}"
          fi

          if [[ ! "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Cloudflare Account ID is invalid. Use only the 32-character account id or a dashboard URL containing it." >&2
            exit 1
          fi

          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare_account.outputs.account_id }}
          command: pages deploy dist --project-name=serdararminsargut --branch=main

      - name: Verify live canonical sitemap as Googlebot
        shell: bash
        run: |
          set -euo pipefail
          sitemap='https://serdararminsargut.pages.dev/sitemap.xml'
          robots='https://serdararminsargut.pages.dev/robots.txt'
          ua='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'

          ok=0
          for attempt in $(seq 1 12); do
            rm -f /tmp/sitemap.headers /tmp/sitemap.body
            code=$(curl -sS -L --max-redirs 3 --connect-timeout 10 --max-time 25 \
              -A "$ua" -D /tmp/sitemap.headers -o /tmp/sitemap.body -w '%{http_code}' "$sitemap" || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); v=$0} END{sub(/^[^:]*:[[:space:]]*/,"",v); print v}' /tmp/sitemap.headers)
            echo "Attempt $attempt: HTTP=$code Content-Type=$ctype"
            if [[ "$code" == "200" ]] && [[ "$ctype" == application/xml* || "$ctype" == text/xml* ]]; then
              if python - <<'PY'
          import xml.etree.ElementTree as ET

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          expected_root = '{http://www.sitemaps.org/schemas/sitemap/0.9}urlset'

          def extract(path):
              root = ET.parse(path).getroot()
              if root.tag != expected_root:
                  raise SystemExit(f'Unexpected sitemap root in {path}: {root.tag}')
              locs = []
              for node in root.findall('sm:url', ns):
                  loc = node.find('sm:loc', ns)
                  value = (loc.text or '').strip() if loc is not None else ''
                  if not value:
                      raise SystemExit(f'Missing loc in {path}')
                  locs.append(value)
              if not locs:
                  raise SystemExit(f'No sitemap URLs in {path}')
              return locs

          source_locs = extract('sitemap.xml')
          live_locs = extract('/tmp/sitemap.body')
          if live_locs != source_locs:
              raise SystemExit(f'Live sitemap differs from source: source={len(source_locs)} live={len(live_locs)}')
          print(f'Live sitemap parsed successfully and matches source with {len(live_locs)} URLs')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done

          if [[ "$ok" != "1" ]]; then
            echo 'Live sitemap failed Googlebot HTTP/content-type/XML/source validation' >&2
            cat /tmp/sitemap.headers >&2 || true
            head -c 500 /tmp/sitemap.body >&2 || true
            exit 1
          fi

          robots_code=$(curl -sS -L --connect-timeout 10 --max-time 25 -A "$ua" -o /tmp/robots.body -w '%{http_code}' "$robots")
          [[ "$robots_code" == "200" ]]
          grep -Fq 'User-agent: Googlebot' /tmp/robots.body
          grep -Fq 'Sitemap: https://serdararminsargut.pages.dev/sitemap.xml' /tmp/robots.body
          echo 'Live robots.txt is reachable by Googlebot and declares only the canonical sitemap.xml'
