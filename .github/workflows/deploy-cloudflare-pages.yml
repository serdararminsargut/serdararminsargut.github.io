name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-serdararminsargut
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy serdararminsargut.pages.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-production

      - name: Prepare static site bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          for item in \
            .nojekyll \
            _headers \
            404.html \
            ai.txt \
            ar \
            assets \
            az \
            blog \
            card.html \
            casting-card \
            en \
            favicon.svg \
            index.html \
            kk \
            ky \
            llms.txt \
            llms-full.txt \
            postcard.html \
            rehber \
            robots.txt \
            ru \
            sitemap.xml \
            sitemap-google.xml \
            uz \
            yandex_*.html
          do
            if compgen -G "$item" > /dev/null; then
              cp -R $item dist/
            elif [ -e "$item" ]; then
              cp -R "$item" dist/
            fi
          done

      - name: Validate technical SEO bundle
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/sitemap-google.xml

          python3 - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path('dist')
          canonical_host = 'https://serdararminsargut.pages.dev/'

          def validate_sitemap(path):
              try:
                  tree = ET.parse(path)
              except ET.ParseError as exc:
                  raise SystemExit(f'Invalid sitemap XML in {path.name}: {exc}')
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              locs = [el.text.strip() for el in tree.findall('.//sm:loc', ns) if el.text]
              if not locs:
                  raise SystemExit(f'{path.name} contains no <loc> URLs')
              if len(locs) != len(set(locs)):
                  raise SystemExit(f'{path.name} contains duplicate <loc> URLs')
              if any(not u.startswith(canonical_host) for u in locs):
                  raise SystemExit(f'{path.name} contains a URL outside the canonical Cloudflare host')
              return locs

          primary_locs = validate_sitemap(root / 'sitemap.xml')
          google_locs = validate_sitemap(root / 'sitemap-google.xml')
          if set(primary_locs) != set(google_locs):
              raise SystemExit('sitemap-google.xml URL set does not match sitemap.xml')

          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          required = [
              'User-agent: Googlebot',
              'User-agent: Bingbot',
              'User-agent: YandexBot',
              'Sitemap: https://serdararminsargut.pages.dev/sitemap.xml',
          ]
          for token in required:
              if token not in robots:
                  raise SystemExit(f'robots.txt missing required directive: {token}')

          headers = (root / '_headers').read_text(encoding='utf-8')
          for sitemap_name in ('/sitemap.xml', '/sitemap-google.xml'):
              if sitemap_name not in headers:
                  raise SystemExit(f'_headers missing rule for {sitemap_name}')
          if headers.count('Content-Type: application/xml; charset=UTF-8') < 2:
              raise SystemExit('_headers must declare XML Content-Type for both sitemap files')

          bad_noindex = []
          bad_canonical = []
          intentional_noindex = {'card.html', 'postcard.html', '404.html'}

          for path in root.rglob('*.html'):
              if path.name in intentional_noindex or path.name.startswith('yandex_'):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I) or \
                 re.search(r'<meta[^>]+content=["\'][^"\']*noindex[^"\']*["\'][^>]+name=["\']robots["\']', text, re.I):
                  bad_noindex.append(str(path))
              canonical = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', text, re.I)
              if not canonical:
                  canonical = re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']', text, re.I)
              if canonical and not canonical.group(1).startswith(canonical_host):
                  bad_canonical.append(f'{path}: {canonical.group(1)}')

          if bad_noindex:
              raise SystemExit('Indexable Cloudflare bundle contains noindex: ' + ', '.join(bad_noindex))
          if bad_canonical:
              raise SystemExit('Canonical URL outside Cloudflare host: ' + ', '.join(bad_canonical))

          print(f'SEO validation passed: {len(primary_locs)} URLs in both sitemap files; XML headers configured.')
          PY

      - name: Normalize Cloudflare account id
        id: cloudflare_account
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          account_id="$raw"

          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then
            account_id="${BASH_REMATCH[1]}"
          fi

          if [[ ! "$account_id" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Cloudflare Account ID is invalid. Use only the 32-character account id or a dashboard URL containing it." >&2
            exit 1
          fi

          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare_account.outputs.account_id }}
          command: pages deploy dist --project-name=serdararminsargut --branch=main

      - name: Verify live sitemap HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          base='https://serdararminsargut.pages.dev'

          verify_sitemap() {
            local path="$1"
            local tmp_headers tmp_body meta code ctype effective redirects
            tmp_headers="$(mktemp)"
            tmp_body="$(mktemp)"

            for attempt in 1 2 3 4 5 6; do
              : > "$tmp_headers"
              : > "$tmp_body"
              meta="$(curl -sS -L --max-redirs 5 \
                -H 'Cache-Control: no-cache' \
                -D "$tmp_headers" \
                -o "$tmp_body" \
                -w '%{http_code}|%{content_type}|%{url_effective}|%{num_redirects}' \
                "$base$path" || true)"

              IFS='|' read -r code ctype effective redirects <<< "$meta"
              echo "$path attempt=$attempt status=$code content-type=$ctype redirects=$redirects effective-url=$effective"

              if [[ "$code" == '200' && ( "$ctype" == application/xml* || "$ctype" == text/xml* ) ]]; then
                python3 - "$tmp_body" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          print('XML parse: OK')
          PY
                echo "Final response headers for $path:"
                cat "$tmp_headers"
                rm -f "$tmp_headers" "$tmp_body"
                return 0
              fi

              sleep 10
            done

            echo "Live sitemap verification failed for $path" >&2
            echo "Last response headers:" >&2
            cat "$tmp_headers" >&2 || true
            rm -f "$tmp_headers" "$tmp_body"
            return 1
          }

          verify_sitemap '/sitemap.xml'
          verify_sitemap '/sitemap-google.xml'
