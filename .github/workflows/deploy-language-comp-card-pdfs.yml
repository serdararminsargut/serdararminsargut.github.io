name: Verify live language Comp Card PDFs (read-only)

# The primary Deploy Cloudflare Pages workflow already builds all 4
# optimized PDFs. Never deploy again here: the previous follow-up workflow
# regenerated 5.5 MB PDFs and overrode verified 0.7 MB assets.
on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify optimized live PDFs and attachment headers without deploying
        shell: bash
        run: |
          set -euo pipefail
          base='https://serdararminsargut.com'
          for lang in TR EN AR RU; do
            file="Serdar-Armin-Sargut-Comp-Card-${lang}.pdf"
            url="${base}/downloads/${file}"
            ready=0
            for attempt in $(seq 1 12); do
              curl -sS -L --retry 0 --connect-timeout 8 --max-time 24 \
                -D /tmp/serdar-pdf-headers -o /tmp/serdar-pdf-body "$url" || true
              if grep -Eiq '^HTTP/[[:digit:].]+ 200' /tmp/serdar-pdf-headers \
                  && grep -Eiq '^content-type:[[:space:]]*application/pdf' /tmp/serdar-pdf-headers \
                  && grep -Eiq '^content-disposition:[[:space:]]*attachment' /tmp/serdar-pdf-headers \
                  && head -c 5 /tmp/serdar-pdf-body | grep -Fq '%PDF-'; then
                size=$(stat -c%s /tmp/serdar-pdf-body)
                if (( size > 20000 && size < 1200000 )); then
                  ready=1
                  echo "${lang}: PDF ${size} bytes, HTTP 200, forced download PASS"
                  break
                fi
                echo "${lang}: stale/oversized PDF ${size} bytes, retry ${attempt}"
              fi
              sleep 5
            done
            if (( ready != 1 )); then
              echo "${lang}: FAIL after 12 attempts: expected PDF under 1.2 MB" >&2
              exit 1
            fi
          done
          echo 'SERDAR_PRODUCTION_FOUR_OPTIMIZED_PDFS_PASS 4/4'
          echo 'READ_ONLY: no wrangler deployments and no main/DNS/Access mutations.'
