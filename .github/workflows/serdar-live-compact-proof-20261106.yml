name: Serdar live compact release proof
on:
  push:
    branches: ['test/serdar-compact-local-qa-20261106']
    paths: ['.github/workflows/serdar-live-compact-proof-20261106.yml']
permissions:
  contents: read
jobs:
  live-read-only:
    if: github.repository == 'serdararminsargut/serdararminsargut.github.io' && github.ref == 'refs/heads/test/serdar-compact-local-qa-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v4
        with:
          ref: 71000a98436e20d4367c89cce8e31a0a43d854c6
          persist-credentials: false
      - name: Install read-only verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils zbar-tools
      - name: Verify live routes, source equality, PDFs and QR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-proof
          python3 - <<'PY'
          import hashlib,json,re,subprocess,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.error import HTTPError,URLError
          root=Path('.');out=Path('live-proof');base='https://serdararminsargut.com'
          codes='tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko'.split()
          expected_built={'tr':'7e414a0b11cbd587c8c80ba4baec21ab3c9d2a3861886b3bd40dc29c66115bab','en':'27ab384326c700299b7d01201b6e6cc8d91e30c1798aa5db21b14a18e816c00f','ar':'98273717afddd392a88bc35a3b34f58f1f9659a3f2ba92bf8eb3117a895e2bba','ru':'4c05abefd7cd2aefe4edcb50df8a8a89442c194d35b3d4750fbe8e5b2a962350'}
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__();self.lang='';self.title=0;self.h1=0;self.canonical=[];self.alts={}
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='html':self.lang=(d.get('lang') or '').lower()
                  if tag=='title':self.title+=1
                  if tag=='h1':self.h1+=1
                  if tag=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
                  if tag=='link' and d.get('rel')=='alternate' and d.get('hreflang'):self.alts[d['hreflang'].lower()]=d.get('href')
          def decode_cf(hexstr):
              raw=bytes.fromhex(hexstr)
              return ''.join(chr(x ^ raw[0]) for x in raw[1:])
          def normalize_cloudflare(data):
              s=data.decode('utf-8')
              s=re.sub(r'<a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="([0-9a-f]+)">\[email&#160;protected\]</a>',lambda m:decode_cf(m.group(1)),s)
              s=re.sub(r'href="/cdn-cgi/l/email-protection#([0-9a-f]+)"',lambda m:'href="mailto:'+decode_cf(m.group(1))+'"',s)
              s=re.sub(r'<span class="__cf_email__" data-cfemail="([0-9a-f]+)">\[email&#160;protected\]</span>',lambda m:decode_cf(m.group(1)),s)
              s=re.sub(r'<!-- Cloudflare Pages Analytics -->.*?<!-- Cloudflare Pages Analytics -->','',s,flags=re.S)
              return s.encode('utf-8')
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0 Serdar-Release-ReadOnly/1.0','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=25) as res:
                  return res.status,res.geturl(),res.headers.get('Content-Type',''),res.read()
          results=[]; failures=[]
          for code in codes:
              entry={'lang':code,'errors':[]}
              try:
                  status,url,ctype,data=get('/casting-card/'+code)
                  parser=Head();parser.feed(data.decode('utf-8'))
                  expected=base+'/casting-card/'+code
                  src=(root/'casting-card'/(code+'.html')).read_bytes()
                  entry['html']={'status':status,'final_url':url,'content_type':ctype,'sha256':hashlib.sha256(data).hexdigest(),'matches_source_raw':data==src,'matches_source_after_cf_normalization':normalize_cloudflare(data)==src,'lang':parser.lang,'canonical':parser.canonical,'hreflang_count':len(parser.alts)}
                  if status!=200 or urllib.parse.urlparse(url).hostname!='serdararminsargut.com' or 'text/html' not in ctype.lower():entry['errors'].append('HTML_HTTP')
                  if normalize_cloudflare(data)!=src:entry['errors'].append('HTML_SOURCE_MISMATCH_AFTER_EDGE_NORMALIZATION')
                  if parser.lang!=code or parser.title!=1 or parser.h1!=1 or parser.canonical!=[expected]:entry['errors'].append('HTML_META')
                  if set(parser.alts)!=(set(codes)|{'x-default'}) or any(parser.alts.get(c)!=base+'/casting-card/'+c for c in codes) or parser.alts.get('x-default')!=base+'/casting-card/tr':entry['errors'].append('HREFLANG')
              except Exception as e:entry['errors'].append('HTML_EXCEPTION_'+type(e).__name__)
              try:
                  path='/downloads/Serdar-Armin-Sargut-Comp-Card-'+code.upper()+'.pdf'
                  status,url,ctype,data=get(path)
                  f=out/(code+'.pdf');f.write_bytes(data)
                  actual=hashlib.sha256(data).hexdigest()
                  expected=expected_built.get(code) or hashlib.sha256((root/path.lstrip('/')).read_bytes()).hexdigest()
                  info=subprocess.run(['pdfinfo',str(f)],capture_output=True,text=True,timeout=25)
                  pages=re.search(r'^Pages:\s+(\d+)',info.stdout,re.M)
                  render=subprocess.run(['pdftoppm','-f','1','-l','1','-scale-to','1600','-png','-singlefile',str(f),str(out/code)],capture_output=True,timeout=30)
                  qr=subprocess.run(['zbarimg','--quiet','--raw',str(out/(code+'.png'))],capture_output=True,text=True,timeout=20) if render.returncode==0 else None
                  qrval=qr.stdout.strip() if qr else ''
                  entry['pdf']={'status':status,'final_url':url,'content_type':ctype,'bytes':len(data),'sha256':actual,'expected_sha256':expected,'pages':int(pages.group(1)) if pages else None,'qr':qrval}
                  if status!=200 or urllib.parse.urlparse(url).hostname!='serdararminsargut.com' or 'application/pdf' not in ctype.lower() or not data.startswith(b'%PDF-'):entry['errors'].append('PDF_HTTP')
                  if actual!=expected:entry['errors'].append('PDF_SHA_MISMATCH')
                  if info.returncode or not pages or int(pages.group(1))!=1:entry['errors'].append('PDF_PAGES')
                  if qrval!='https://serdararminsargut.com/':entry['errors'].append('QR')
              except Exception as e:entry['errors'].append('PDF_EXCEPTION_'+type(e).__name__)
              results.append(entry)
              print('LIVE_CHECK',code,'PASS' if not entry['errors'] else ','.join(entry['errors']),flush=True)
          site={}
          for path in ('/','/links/','/robots.txt','/sitemap.xml'):
              try:
                  status,url,ctype,data=get(path)
                  record={'status':status,'final_url':url,'content_type':ctype}
                  if path=='/robots.txt':record['sitemap_present']=('Sitemap: '+base+'/sitemap.xml') in data.decode('utf-8')
                  if path=='/sitemap.xml':
                      tree=ET.fromstring(data);urls=[x.text for x in tree.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')];record['url_count']=len(urls);record['casting_count']=sum((base+'/casting-card/'+c) in urls for c in codes);record['same_origin']=all(urllib.parse.urlparse(u).hostname=='serdararminsargut.com' for u in urls if u)
                  site[path]=record
              except Exception as e:site[path]={'error':type(e).__name__}
          if any(x.get('status')!=200 for x in site.values()):failures.append('CORE_HTTP')
          if not site.get('/robots.txt',{}).get('sitemap_present'):failures.append('ROBOTS_SITEMAP')
          sm=site.get('/sitemap.xml',{})
          if sm.get('casting_count')!=26 or not sm.get('same_origin'):failures.append('SITEMAP')
          failures += [x['lang']+':'+','.join(x['errors']) for x in results if x['errors']]
          report={'source_commit':'71000a98436e20d4367c89cce8e31a0a43d854c6','locales':results,'site':site,'failures':failures}
          (out/'results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('LIVE_RESULTS',len(results)-sum(bool(x['errors']) for x in results),'/',len(results),'failures',failures,flush=True)
          assert len(results)==26 and not failures
          PY
      - name: Save non-sensitive results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-live-compact-results
          path: live-proof/results.json
          retention-days: 7
          if-no-files-found: warn
