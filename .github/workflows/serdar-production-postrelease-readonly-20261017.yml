name: Serdar production postrelease HTTP proof (read-only)
on:
  push:
    branches: ['test/serdar-release-candidate-20261017']
    paths: ['.github/workflows/serdar-production-postrelease-readonly-20261017.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-http-only:
    if: github.ref == 'refs/heads/test/serdar-release-candidate-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check only Serdar production HTTP URLs and PDF download headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, time
          import urllib.error
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          SITE='https://serdararminsargut.com'
          HEADERS={'User-Agent':'Serdar-Production-ReadOnly-QA/20261017'}
          report={'project':'SERDAR_ONLY','mode':'READ_ONLY_POSTRELEASE','url':SITE,'checks':[]}

          def fetch(route, expected=200):
              url=SITE+route
              error=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url,headers=HEADERS)
                      with urllib.request.urlopen(req,timeout=20) as response:
                          raw=response.read()
                          assert response.status==expected,(route,response.status)
                          return response,raw
                  except (urllib.error.URLError,TimeoutError) as exc:
                      error=str(exc)
                      time.sleep(1)
              raise AssertionError(f'{route}: repeated HTTP failure {error}')

          def check(label,fn):
              try:
                  info=fn()
                  report['checks'].append({'check':label,'status':'PASS','info':info})
                  print('SERDAR_PRODUCTION_PASS '+label+': '+str(info),flush=True)
              except Exception as exc:
                  report['checks'].append({'check':label,'status':'FAIL','error':str(exc)})
                  print('SERDAR_PRODUCTION_FAIL '+label+': '+str(exc),flush=True)

          def page(route):
              response,raw=fetch(route)
              html=raw.decode('utf-8')
              hdr=response.headers
              assert 'text/html' in hdr.get('Content-Type',''),f'{route}: not HTML'
              assert 'noindex' not in hdr.get('X-Robots-Tag','').lower(),f'{route}: production noindex header!'
              assert re.search(r'<link[^>]*rel=["\x27]canonical["\x27]',html,re.I),f'{route}: missing canonical'
              assert 'https://serdararminsargut.com/' in html,f'{route}: missing original canonical domain'
              assert 'og:image' in html,f'{route}: missing og:image'
              assert 'Duru Mualla' not in html,f'{route}: project isolation'
              return {'status':response.status,'htmlBytes':len(raw),'notIndexedBlocked':True}
          for path in ('/','/en/','/ar/','/ru/','/casting-card/tr.html','/links/'):
              check('HTML '+path,lambda p=path:page(p))

          def sitemap():
              response,raw=fetch('/sitemap.xml')
              root=ET.fromstring(raw)
              ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              locs=[(e.text or '').strip() for e in root.findall('.//s:loc',ns)]
              assert len(locs)==90,f'Expected 90 URLs, found {len(locs)}'
              assert all(u.startswith(SITE+'/') for u in locs),'noncanonical URL'
              assert len(locs)==len(set(locs)),'duplicate loc'
              return {'count':len(locs),'bytes':len(raw)}
          check('Sitemap 90 canonical URLs',sitemap)

          def robots():
              response,raw=fetch('/robots.txt')
              t=raw.decode('utf-8')
              assert 'Sitemap: https://serdararminsargut.com/sitemap.xml' in t
              assert 'User-agent: Googlebot' in t
              assert 'Disallow: /' not in t,'Production robots blanket block'
              return {'bytes':len(raw),'noFullSiteDisallow':True}
          check('Production robots indexable',robots)

          for lang in ('TR','EN','AR','RU'):
              def pdf_check(code=lang):
                  f=f'Serdar-Armin-Sargut-Comp-Card-{code}.pdf'
                  response,raw=fetch('/downloads/'+f)
                  ctype=response.headers.get('Content-Type','')
                  dispo=response.headers.get('Content-Disposition','')
                  assert 'application/pdf' in ctype,ctype
                  assert 'attachment' in dispo.lower() and f in dispo,dispo
                  assert raw.startswith(b'%PDF-'),f'{code}: not a PDF'
                  assert 20000<len(raw)<1200000,f'{code}: unexpected size {len(raw)}'
                  return {'status':response.status,'size':len(raw),'disposition':dispo}
              check('PDF attachment '+lang,pdf_check)

          def css():
              _,body=fetch('/assets/css/site.css')
              text=body.decode('utf-8')
              assert '.credits' in text,'No acting credits CSS'
              assert 'repeat(3,minmax(0,1fr))!important' not in text,'Old forced 3-column acting cards'
              assert 'Serdar tablet hero readability' in text,'Latest tablet hero CSS not deployed'
              return {'bytes':len(body),'actingCreditsOverrideRemoved':True}
          check('Live production CSS updated',css)

          summary={'total':len(report['checks']),
                   'passed':sum(x['status']=='PASS' for x in report['checks']),
                   'failed':sum(x['status']=='FAIL' for x in report['checks'])}
          print('SERDAR_PRODUCTION_POSTRELEASE_SUMMARY='+json.dumps(summary),flush=True)
          if summary['failed'] or summary['passed']!=summary['total']:
              raise SystemExit('POSTRELEASE_NO_GO: production HTTP issue detected')
          print('SERDAR_PRODUCTION_POSTRELEASE_HTTP_PASS',flush=True)
          PY
