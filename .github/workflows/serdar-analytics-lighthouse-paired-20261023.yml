name: Serdar analytics Lighthouse paired local A-B (test only)
on:
  push:
    branches: [test/serdar-sitejs-defer-20261023]
    paths: ['.github/workflows/serdar-analytics-lighthouse-paired-20261023.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    if: github.ref == 'refs/heads/test/serdar-sitejs-defer-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm install --no-save --no-package-lock --ignore-scripts lighthouse@12
      - name: Verify exact analytics change and start isolated localhost servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serdar-analytics-lh-evidence
          python3 - <<'PY'
          from pathlib import Path
          a=Path('assets/js/analytics.js').read_text()
          b=Path('experiments/serdar-analytics-minimum-delay-5000-candidate.js').read_text()
          expected=a.replace('window.requestIdleCallback(loadAnalytics, {timeout: 2500});','window.setTimeout(function () { window.requestIdleCallback(loadAnalytics, {timeout: 2500}); }, 5000);').replace('window.setTimeout(loadAnalytics, 1500);','window.setTimeout(loadAnalytics, 5000);')
          assert a!=b and expected==b, 'Candidate differs from authorized timing-only edit'
          PY
          cat > /tmp/serdar-ab-server.py <<'PY'
          import http.server,os,sys
          from pathlib import Path
          class Handler(http.server.SimpleHTTPRequestHandler):
            def end_headers(self):
              self.send_header('X-Robots-Tag','noindex, nofollow, noarchive')
              super().end_headers()
            def do_GET(self):
              if self.path.split('?')[0]=='/assets/js/analytics.js' and sys.argv[2]=='B':
                body=Path('experiments/serdar-analytics-minimum-delay-5000-candidate.js').read_bytes()
                self.send_response(200)
                self.send_header('Content-Type','application/javascript')
                self.send_header('Content-Length',str(len(body)))
                self.end_headers()
                self.wfile.write(body)
              elif self.path.split('?')[0]=='/robots.txt':
                body=b'User-agent: *\nDisallow: /\n'
                self.send_response(200)
                self.send_header('Content-Type','text/plain')
                self.send_header('Content-Length',str(len(body)))
                self.end_headers()
                self.wfile.write(body)
              else: super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1',int(sys.argv[1])),Handler).serve_forever()
          PY
          python3 /tmp/serdar-ab-server.py 8765 A > /tmp/serdar-A.log 2>&1 &
          python3 /tmp/serdar-ab-server.py 8766 B > /tmp/serdar-B.log 2>&1 &
          for port in 8765 8766; do
            for i in {1..30}; do if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi; sleep 1; done
            curl -fsSI "http://127.0.0.1:$port/" | grep -iq 'x-robots-tag: noindex'
            curl -fsS "http://127.0.0.1:$port/robots.txt" | grep -Fxq 'Disallow: /'
          done
          sha256sum assets/js/analytics.js experiments/serdar-analytics-minimum-delay-5000-candidate.js > serdar-analytics-lh-evidence/source-sha256.txt
      - name: Run alternating mobile Lighthouse A-B three times
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            for v in A B; do
              if [[ "$v" == A ]]; then port=8765; else port=8766; fi
              ./node_modules/.bin/lighthouse "http://127.0.0.1:$port/" --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --preset=perf --form-factor=mobile --output=json --output-path="serdar-analytics-lh-evidence/$v-$i.json" --quiet
            done
          done
      - name: Summarize measured medians
        run: |
          python3 - <<'PY'
          import json,statistics,pathlib
          p=pathlib.Path('serdar-analytics-lh-evidence')
          rows=[]
          for v in 'AB':
            for i in (1,2,3):
              x=json.loads((p/f'{v}-{i}.json').read_text())
              a=x['audits']
              rows.append(dict(variant=v,run=i,score=round(x['categories']['performance']['score']*100),lcp_ms=a['largest-contentful-paint']['numericValue'],tbt_ms=a['total-blocking-time']['numericValue'],fcp_ms=a['first-contentful-paint']['numericValue'],cls=a['cumulative-layout-shift']['numericValue']))
          metrics=('score','lcp_ms','tbt_ms','fcp_ms','cls')
          med={v:{k:statistics.median(r[k] for r in rows if r['variant']==v) for k in metrics} for v in 'AB'}
          out=dict(scope='Serdar local-only Lighthouse A/B; no production changes; analytics retention not validated',rows=rows,medians=med,delta_B_minus_A={k:med['B'][k]-med['A'][k] for k in metrics})
          (p/'summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out['medians'],indent=2))
          PY
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-analytics-lighthouse-paired-evidence
          path: serdar-analytics-lh-evidence/
          retention-days: 14
