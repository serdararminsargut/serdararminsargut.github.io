name: Serdar 26 compact PDF quality check (test only)
on:
  push:
    branches: ['test/serdar-pdf-spacing-20261106']
    paths: ['.github/workflows/serdar-pdf-26-quality.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          python -m pip install 'playwright==1.63.0' 'pypdf>=5,<7'
          python -m playwright install chromium
          sudo apt-get install -y poppler-utils ghostscript zbar-tools
      - name: Create and inspect samples without deploying
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdf-samples
          python -m http.server 8767 --bind 127.0.0.1 > /tmp/serdar-pdf-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          codes='tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko'.split()
          out=Path('pdf-samples')
          with sync_playwright() as p:
            browser=p.chromium.launch(args=['--no-sandbox'])
            for code in codes:
              page=browser.new_page(viewport={'width':1280,'height':900})
              page.route('**/*',lambda r:r.continue_() if r.request.url.startswith('http://127.0.0.1:8767/') else r.abort())
              response=page.goto('http://127.0.0.1:8767/casting-card/'+code+'.html',wait_until='load',timeout=30000)
              assert response.status==200,code
              assert page.evaluate("document.fonts.ready.then(()=>[...document.images].every(i=>i.complete && i.naturalWidth>0))"),code
              page.emulate_media(media='print')
              page.add_style_tag(content='@media print{.photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}.look{break-inside:avoid}.bottom{break-inside:avoid}}')
              data=page.pdf(format='A4',prefer_css_page_size=True,print_background=True,display_header_footer=False)
              f=out/(code+'-raw.pdf'); f.write_bytes(data)
              reader=PdfReader(str(f))
              assert len(reader.pages)==1,(code,len(reader.pages))
              assert 'Serdar' in (reader.pages[0].extract_text() or ''),code
              print('PDF_ONE_PAGE_PASS',code,flush=True)
              page.close()
            browser.close()
          PY
          for lang in tr en ru ar az de fr es kk uz ky tk it pt-br uk pl bg el sr-latn sq fa ur hi zh-hans ja ko; do
            gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -sOutputFile="pdf-samples/$lang.pdf" "pdf-samples/$lang-raw.pdf"
            pdftoppm -f 1 -l 1 -scale-to 1800 -png -singlefile "pdf-samples/$lang.pdf" "pdf-samples/$lang-page1"
            decoded=$(zbarimg --quiet --raw "pdf-samples/$lang-page1.png" 2>/dev/null || true)
            case "$decoded" in https://serdararminsargut.com*|http://serdararminsargut.com*) ;; *) echo "QR_FAIL $lang"; exit 1;; esac
            echo "QR_PASS $lang"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serdar-26-compact-pdf-test
          path: |
            pdf-samples/*.png
            pdf-samples/*.pdf
            !pdf-samples/*-raw.pdf
          retention-days: 3
