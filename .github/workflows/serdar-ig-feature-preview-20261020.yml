name: Serdar Instagram spotlight isolated preview QA
on:
  push:
    branches:
      - test/serdar-instagram-profile-card-20261020
    paths:
      - index.html
      - assets/css/site.css
      - .github/workflows/serdar-ig-feature-preview-20261020.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: serdar-ig-profile-card-preview-20261020
  cancel-in-progress: true

jobs:
  instagram-card-qa:
    if: github.ref == 'refs/heads/test/serdar-instagram-profile-card-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert source boundaries and existing Instagram tracking
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "serdararminsargut/serdararminsargut.github.io"
          test "$GITHUB_REF" = "refs/heads/test/serdar-instagram-profile-card-20261020"
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('index.html').read_text(encoding='utf-8')
          css=Path('assets/css/site.css').read_text(encoding='utf-8')
          assert s.count('<section class="ig-feature"')==1
          assert s.count('data-ig-placement="top_profile_')==4
          assert s.count('<h1')==1
          assert '.ig-feature__panel' in css
          assert 'body.portfolio-home .mobile-ig{display:none}' in css
          assert 'instagram.com/serdararminsargutt/' in s
          assert "https://www.instagram.com/serdararminsargutt/" in Path('assets/js/site.js').read_text()
          assert "data-ig-placement" in Path('assets/js/site.js').read_text()
          assert "instagram_click" in Path('assets/js/site.js').read_text()
          a=re.findall(r'<script type="application/ld\+json">([\s\S]*?)</script>',s)
          assert a
          json.loads(a[0])
          for img in ('serdar-armin-sargut-siyah-cizgili-takim-portre-320.webp',
                      'serdar-armin-sargut-gri-takim-yelek.webp',
                      'serdar-armin-sargut-siyah-moda-yakin-plan.webp',
                      'serdar-armin-sargut-set-kamera-arkasi.webp'):
              assert (Path('assets/photos')/img).is_file(),img
          print('SERDAR_INSTAGRAM_SOURCE_GUARD_PASS',flush=True)
          PY
      - name: Assemble unchanged full static site for isolated preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for item in .nojekyll _headers _redirects 404.html ai.txt ar assets az blog card.html casting-card de downloads en fa favicon.svg favicon.ico favicon-96x96.png fr index.html indexnow-key.txt 72f0dad836e29ffcc2d9dd42a794dbf0.txt erkek-cocuk-model spor-giyim-cocuk-modeli cocuk-giyim-modeli e-ticaret-cocuk-modeli it kk ky llms.txt llms-full.txt links postcard.html projeler rehber robots.txt ru sitemap.xml sitemap-google.xml sitemap.txt tk uz zh-cn; do
            if test -e "$item"; then cp -R "$item" dist/; fi
          done
          test -s dist/index.html
          test -s dist/assets/css/site.css
          test -s dist/_headers
      - name: Generate existing Comp Card PDFs for faithful preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0' 'pypdf>=5,<7' 'Pillow>=10,<13'
          python3 -m playwright install --with-deps chromium
          python3 scripts/serdar_generate_comp_cards.py dist
          for lang in TR EN AR RU; do
            f="dist/downloads/Serdar-Armin-Sargut-Comp-Card-$lang.pdf"
            test -s "$f"
            head -c 5 "$f" | grep -Fq '%PDF-'
          done
          echo 'SERDAR_INSTAGRAM_PREVIEW_PDF_4_PASS'
      - name: Apply test-only noindex guard to dist, never production source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('dist/_headers')
          content=h.read_text(encoding='utf-8')
          assert content.startswith('/*\n')
          assert 'X-Robots-Tag: noindex' not in content
          h.write_text(content.replace('/*\n','/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n',1),encoding='utf-8')
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n',encoding='utf-8')
          print('SERDAR_INSTAGRAM_NOINDEX_DIST_ONLY_PASS',flush=True)
          PY
          sha256sum dist/index.html dist/assets/css/site.css dist/_headers dist/robots.txt
      - name: Normalize existing Cloudflare account ID
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          id="$raw"
          if [[ "$raw" =~ dash.cloudflare.com/([a-fA-F0-9]{32}) ]]; then id="${BASH_REMATCH[1]}"; fi
          [[ "$id" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Invalid Cloudflare account ID'; exit 1; }
          echo "::add-mask::$id"
          echo "account_id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy isolated test branch preview only
        id: deployed
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy dist --project-name=serdararminsargut --branch=test/serdar-instagram-profile-card-20261020
      - name: Check actual Pages response and preview noindex
        shell: bash
        env:
          PREVIEW: ${{ steps.deployed.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW" =~ ^https://[a-f0-9]+\.serdararminsargut\.pages\.dev/?$ ]] || exit 1
          echo "SERDAR_INSTAGRAM_IMMUTABLE_PREVIEW=$PREVIEW"
          for route in / /assets/css/site.css /assets/js/site.js /robots.txt /en/; do
            status=$(curl -sSL --max-time 25 --connect-timeout 10 -D /tmp/ig-headers -o /tmp/ig-body -w '%{http_code}' "$PREVIEW$route")
            test "$status" = 200 || { echo "BAD_HTTP $route $status"; exit 1; }
            grep -Eiq '^x-robots-tag:[[:space:]]*noindex' /tmp/ig-headers
          done
          curl -fsSL --connect-timeout 10 --max-time 25 "$PREVIEW/robots.txt" | grep -Fxq 'Disallow: /'
          echo 'SERDAR_INSTAGRAM_PREVIEW_HTTP_NOINDEX_PASS'
      - name: Browser QA 360, 393, 412 and desktop widths, images, analytics events
        shell: bash
        env:
          PREVIEW: ${{ steps.deployed.outputs.deployment-url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,asyncio,json,re
          from playwright.async_api import async_playwright
          base=os.environ['PREVIEW'].rstrip('/')
          assert re.fullmatch(r'https://[a-f0-9]+\.serdararminsargut\.pages\.dev',base)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  for width in (360,393,412,1440):
                      ctx=await b.new_context(viewport={'width':width,'height':850},device_scale_factor=2,is_mobile=width<800,has_touch=width<800,service_workers='block')
                      page=await ctx.new_page()
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      # Avoid test hits going to real analytics or Instagram
                      for patt in ('**/www.googletagmanager.com/**','**/mc.yandex.ru/**','**/mc.yandex.com/**','**/www.google-analytics.com/**','**/www.instagram.com/**'):
                          await page.route(patt,lambda route:route.abort())
                      r=await page.goto(base+'/',wait_until='domcontentloaded',timeout=35000)
                      assert r.status==200
                      await page.wait_for_timeout(1100)
                      await page.locator('.ig-feature').scroll_into_view_if_needed()
                      for img in await page.locator('.ig-feature img').all():
                          await img.scroll_into_view_if_needed()
                      await page.wait_for_timeout(850)
                      state=await page.evaluate('''() => {
                        const card=document.querySelector('.ig-feature');
                        const imgs=[...card.querySelectorAll('img')];
                        const links=[...card.querySelectorAll('a[data-ig-placement]')];
                        const rect=card.getBoundingClientRect();
                        return {
                          h1:document.querySelectorAll('h1').length,
                          instagramCard:!!card,
                          cardBeforeProfile:card.compareDocumentPosition(document.querySelector('#profil')) & Node.DOCUMENT_POSITION_FOLLOWING ? true : false,
                          overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
                          documentWidth:document.documentElement.scrollWidth,
                          viewport:document.documentElement.clientWidth,
                          images:imgs.map(x=>({complete:x.complete,loaded:x.naturalWidth>0,src:x.getAttribute('src')})),
                          links:links.map(x=>({placement:x.dataset.igPlacement,url:x.href})),
                          cardWidth:rect.width,
                          ctaText:card.querySelector('.ig-feature__cta').textContent.trim(),
                          ctaFontSize:parseFloat(getComputedStyle(card.querySelector('.ig-feature__cta')).fontSize),
                          ctaFontWeight:getComputedStyle(card.querySelector('.ig-feature__cta')).fontWeight,
                          ctaTextLines:(()=>{const r=document.createRange();r.selectNodeContents(card.querySelector('.ig-feature__cta'));return r.getClientRects().length;})(),
                          ctaHeight:card.querySelector('.ig-feature__cta').getBoundingClientRect().height,
                          stickyStyle:getComputedStyle(document.querySelector('.mobile-ig')).display,
                          trackingReady:typeof window.sasTrackInstagram==='function',
                          hasGuardianText:card.textContent.includes('Veli tarafından yönetilen hesap')
                        };
                      }''')
                      assert state['instagramCard'] and state['cardBeforeProfile'],state
                      assert state['h1']==1 and state['overflow']<=2,state
                      assert len(state['images'])==4 and all(x['loaded'] for x in state['images']),state
                      assert len(state['links'])==4 and all('instagram.com/serdararminsargutt' in x['url'] for x in state['links']),state
                      assert state['hasGuardianText'] and state['trackingReady'],state
                      assert state['ctaFontSize']<=15 and state['ctaFontWeight']=='600',state
                      assert state['ctaTextLines']==1 and state['ctaHeight']<=58,state
                      assert not errors,errors
                      if width<800: assert state['stickyStyle']=='none',state
                      if width==393:
                          await page.locator('[data-ig-placement="top_profile_cta"]').click()
                          await page.wait_for_timeout(150)
                          info=await page.evaluate('sessionStorage.getItem("sas_last_ig_click")')
                          assert info and json.loads(info)['placement']=='top_profile_cta',info
                          state['gaClickTracking']='PASS'
                      print('SERDAR_INSTAGRAM_BROWSER_PASS='+json.dumps({'width':width,**state},ensure_ascii=False),flush=True)
                      await ctx.close()
                  await b.close()
                  print('SERDAR_INSTAGRAM_CARD_TEST_PASS_4_WIDTHS_4_IMAGES_4_TRACKED_LINKS',flush=True)
          asyncio.run(main())
          PY
