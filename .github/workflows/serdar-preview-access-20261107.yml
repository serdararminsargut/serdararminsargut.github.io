name: Preview access check
on:
  push:
    branches: ['test/serdar-hero-layout-qa-20261107']
    paths: ['.github/workflows/serdar-preview-access-20261107.yml']
permissions:
  contents: read
jobs:
  preview-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check preview response without credentials
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          url = 'https://29e4dd2c.serdararminsargut.pages.dev/'
          request = urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request,timeout=25)
          except urllib.error.HTTPError as error:
              response=error
          print('PREVIEW_HTTP',response.code)
          print('REDIRECT_HOST',urllib.parse.urlsplit(response.headers.get('Location','')).hostname or 'none')
          print('CONTENT_TYPE',response.headers.get('Content-Type','unknown'))
          PY
