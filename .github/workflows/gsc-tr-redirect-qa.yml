name: GSC Turkish redirect QA (preview only)
on:
  push:
    branches: ['test/gsc-tr-redirect-20261119']
    paths: ['.github/workflows/gsc-tr-redirect-qa.yml']
permissions:
  contents: read
jobs:
  local-and-preview:
    if: github.ref == 'refs/heads/test/gsc-tr-redirect-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local Pages HTTP test (no deploy)
        run: |
          set -euo pipefail
          npm install --prefix /tmp/gsc-wrangler --no-audit --no-fund wrangler@4
          mkdir -p /tmp/gsc-site
          cp _redirects _headers index.html 404.html /tmp/gsc-site/
          /tmp/gsc-wrangler/node_modules/.bin/wrangler pages dev /tmp/gsc-site --ip 127.0.0.1 --port 8798 > /tmp/gsc-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:8798/ -o /dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import http.client
          from urllib.parse import urljoin, urlsplit
          base = 'http://127.0.0.1:8798'
          for path in ('/tr', '/tr/'):
              c = http.client.HTTPConnection('127.0.0.1',8798,timeout=10)
              c.request('GET',path)
              r=c.getresponse()
              loc=r.getheader('Location')
              print(path, r.status, 'location=',loc)
              assert r.status == 301 and urljoin(base+path,loc or '') == base+'/'
              r.read(); c.close()
          c=http.client.HTTPConnection('127.0.0.1',8798,timeout=10)
          c.request('GET','/')
          r=c.getresponse()
          print('/',r.status)
          assert r.status == 200
          assert b'lang="tr"' in r.read()
          print('LOCAL_REDIRECT_PASS 2/2')
          PY
      - name: Fixed deployed preview HTTP evidence (read only)
        if: always()
        env:
          CF_ACCESS_ID: ${{ secrets.SERDAR_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_SECRET: ${{ secrets.SERDAR_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import http.client, os, sys
          from urllib.parse import urljoin, urlsplit
          host='c4bac8ca.serdararminsargut.pages.dev'
          base='https://'+host
          cid=os.environ.get('CF_ACCESS_ID','')
          sec=os.environ.get('CF_ACCESS_SECRET','')
          if not cid or not sec:
              print('ACCESS_CREDENTIALS_MISSING')
              sys.exit(1)
          # Fixed TLS host, no automatic redirects, no credential or cookie logging.
          def get(path, auth):
              c=http.client.HTTPSConnection(host,timeout=20)
              try:
                  headers={'User-Agent':'Serdar-Preview-QA/1.0'}
                  if auth:
                      headers.update({'CF-Access-Client-Id':cid,'CF-Access-Client-Secret':sec})
                  c.request('GET',path,headers=headers)
                  r=c.getresponse()
                  return r.status, r.getheader('Location') or '', r.getheader('X-Robots-Tag') or '', r.read(1000000)
              finally:
                  c.close()
          try:
              status, loc, _, _=get('/',False)
              protected=status in (401,403) or (status in (302,303) and '.cloudflareaccess.com' in (urlsplit(loc).hostname or ''))
              print('UNAUTHENTICATED_PREVIEW',status,'PROTECTED' if protected else 'NOT_VERIFIED')
              ok=protected
              for path in ('/tr','/tr/','/'):
                  status, loc, robots, body=get(path,True)
                  target_root=bool(loc) and urljoin(base+path,loc)==base+'/'
                  noindex='noindex' in robots.lower()
                  print('AUTHENTICATED',path,'status=',status,'location_is_preview_root=',target_root,'x_robots_noindex=',noindex)
                  if path=='/':
                      good=status==200 and b'lang="tr"' in body and noindex
                  else:
                      good=status==301 and target_root
                  ok=ok and good
              print('PREVIEW_HTTP_PASS' if ok else 'PREVIEW_HTTP_NOT_VERIFIED')
              sys.exit(0 if ok else 1)
          except Exception as e:
              print('PREVIEW_HTTP_ERROR',type(e).__name__)
              sys.exit(1)
          PY
