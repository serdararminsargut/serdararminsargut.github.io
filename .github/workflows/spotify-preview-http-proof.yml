name: Spotify preview raw HTTP noindex proof (test branch only)
on:
  push:
    branches:
      - test/spotify-homepage-20261115
    paths:
      - .github/workflows/spotify-preview-http-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/test/spotify-homepage-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact preview response status, body and X-Robots-Tag
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          for spec in \
            'SERDAR_TR|https://af7709a1.serdararminsargut.pages.dev/|0gg9VDMXI4csW2DmuBmKKm' \
            'SERDAR_EN|https://af7709a1.serdararminsargut.pages.dev/en/|0gg9VDMXI4csW2DmuBmKKm' \
            'SERDAR_LINKS_TR|https://af7709a1.serdararminsargut.pages.dev/links/|0gg9VDMXI4csW2DmuBmKKm' \
            'SERDAR_LINKS_EN|https://af7709a1.serdararminsargut.pages.dev/links/en/|0gg9VDMXI4csW2DmuBmKKm' \
            'DURU_LINKS|https://ef13f69f.duru-mualla-sargut-site.pages.dev/links/|1HCcJSfDoxrTd5GHaZm4ls'
          do
            IFS='|' read -r label url spotify <<< "$spec"
            echo "::group::$label"
            hdr="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-redirs 0 --connect-timeout 8 --max-time 22 --dump-header "$hdr" --output "$body" --write-out '%{http_code}' "$url" || true)"
            xrobots="$(grep -i '^x-robots-tag:' "$hdr" | tr -d '\r' | head -n 1 || true)"
            location="$(grep -i '^location:' "$hdr" | tr -d '\r' | head -n 1 || true)"
            echo "URL=$url"
            echo "HTTP_STATUS=$status"
            echo "X_ROBOTS_TAG=${xrobots:-MISSING}"
            if [ -n "$location" ]; then echo "REDIRECT_PRESENT=true"; fi
            if [ "$status" != "200" ]; then
              echo "RESULT=UNVERIFIED (not an HTTP 200 portfolio document)"
              errors=$((errors+1))
            elif ! printf '%s' "$xrobots" | grep -Eiq 'noindex'; then
              echo "RESULT=NO_GO (HTTP noindex response header missing)"
              errors=$((errors+1))
            elif ! grep -Fq "$spotify" "$body"; then
              echo "RESULT=NO_GO (expected Spotify show not in response body)"
              errors=$((errors+1))
            else
              echo "RESULT=PASS (HTTP 200 with X-Robots-Tag noindex and expected show URL)"
            fi
            rm -f "$hdr" "$body"
            echo "::endgroup::"
          done
          if [ "$errors" -ne 0 ]; then
            echo "PREVIEW_HTTP_NOINDEX_UNVERIFIED_OR_FAIL=$errors; DO NOT PROMOTE PRODUCTION"
            exit 1
          fi
          echo "ALL_PREVIEW_HTTP_NOINDEX_PASS (READ-ONLY, NO DEPLOY)"
