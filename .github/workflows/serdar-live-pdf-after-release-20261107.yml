name: Serdar live 26 PDF preservation proof
on:
  push:
    branches: ['test/serdar-pdf-pipeline-qa-20261107']
    paths: ['.github/workflows/serdar-live-pdf-after-release-20261107.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare 26 live PDFs and critical pages
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request,concurrent.futures,json
          from pathlib import Path
          manifest=Path('scripts/serdar-comp-card-sha256-20261107.txt').read_text().splitlines()
          def fetch(path):
              request=urllib.request.Request('https://serdararminsargut.com/'+path,headers={'User-Agent':'Mozilla/5.0 ReleaseVerification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=35) as r:
                  return r.status,r.headers.get('Content-Type',''),r.read()
          def check(line):
              expected,path=line.split(maxsplit=1)
              try:
                  status,ctype,data=fetch(path)
                  return {'path':path,'status':status,'pdf':ctype.lower().startswith('application/pdf'),'sha256_match':hashlib.sha256(data).hexdigest()==expected}
              except Exception as e: return {'path':path,'error':str(e)[:200]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              rows=list(pool.map(check,manifest))
          for item in rows: print('LIVE_PDF',json.dumps(item),flush=True)
          result={'files':rows,'pages':{}}
          for path in ['','en/','ar/','robots.txt','sitemap.xml']:
              try:
                  status,ctype,data=fetch(path)
                  ok=status==200
                  if path=='': ok=ok and b'home-tr-desktop-20261107.css' in data
                  if path=='en/': ok=ok and b'locale-interactions-en-20261107.js' in data
                  if path=='sitemap.xml': ok=ok and b'/casting-card/tr' in data
                  result['pages'][path]={'status':status,'content_type':ctype,'ok':ok}
              except Exception as e: result['pages'][path]={'ok':False,'error':str(e)[:200]}
          Path('live-pdf-preservation-results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          assert len(rows)==26 and all(x.get('status')==200 and x.get('pdf') and x.get('sha256_match') for x in rows),rows
          assert all(x['ok'] for x in result['pages'].values()),result['pages']
          print('LIVE_PDF_PRESERVATION_PASS 26/26',flush=True)
          print('LIVE_CRITICAL_PAGES_PASS',len(result['pages']),flush=True)
          PY
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pdf-preservation-evidence
          path: live-pdf-preservation-results.json
          retention-days: 14
          if-no-files-found: warn
