name: Cleanup duplicate hreflang once

on:
  push:
    paths:
      - '.github/workflows/cleanup-hreflang-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate hreflang lines
        shell: python
        run: |
          from pathlib import Path

          files = [Path('az/index.html'), Path('kk/index.html'), Path('uz/index.html'), Path('ky/index.html')]
          targets = [
              '<link href="https://serdararminsargut.pages.dev/az/" hreflang="az" rel="alternate"/>',
              '<link href="https://serdararminsargut.pages.dev/kk/" hreflang="kk" rel="alternate"/>',
              '<link href="https://serdararminsargut.pages.dev/uz/" hreflang="uz" rel="alternate"/>',
              '<link href="https://serdararminsargut.pages.dev/ky/" hreflang="ky" rel="alternate"/>',
          ]

          changed = False
          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              seen = {t: 0 for t in targets}
              out = []
              for line in lines:
                  if line in seen:
                      seen[line] += 1
                      if seen[line] > 1:
                          changed = True
                          continue
                  out.append(line)
              new_text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
              path.write_text(new_text, encoding='utf-8')

          if not changed:
              print('No duplicate hreflang lines found.')
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add az/index.html kk/index.html uz/index.html ky/index.html
          git commit -m "Fix duplicate hreflang tags in Turkic pages"
          git push
