name: Serdar security-branch Chromium viewport QA (NO DEPLOY)
on:
  push:
    branches: [test/security-disclosure-20261104]
    paths:
      - '.github/workflows/serdar-security-local-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-visual-qa:
    if: github.repository == 'serdararminsargut/serdararminsargut.github.io' && github.ref == 'refs/heads/test/security-disclosure-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated security branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ephemeral local Chromium
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0'
          python3 -m playwright install --with-deps chromium
      - name: Run existing read-only QA at required four widths, locally only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          python3 - <<'PY'
          from pathlib import Path
          original=Path('scripts/serdar_local_mobile_qa.py').read_text(encoding='utf-8')
          old='WIDTHS = (390, 430, 760, 761)'
          assert original.count(old)==1, 'Unexpected existing Serdar visual QA script; stop'
          updated=original.replace(old,'WIDTHS = (360, 390, 430, 1280)')
          updated=updated.replace('width in (390, 761)','width in (390, 1280)')
          Path('/tmp/serdar-security-mobile-qa.py').write_text(updated,encoding='utf-8')
          PY
          python3 -m http.server 8767 --bind 127.0.0.1 --directory . > qa-artifacts/local-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8767/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8767/en/ -o /dev/null
          python3 /tmp/serdar-security-mobile-qa.py --url http://127.0.0.1:8767/ --output qa-artifacts/mobile
          echo 'LOCAL_CHROMIUM_ONLY: remote Access, Android and video playback NOT_VERIFIED'
      - name: Preserve screenshots and structured outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serdar-security-local-viewport-evidence
          path: qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
