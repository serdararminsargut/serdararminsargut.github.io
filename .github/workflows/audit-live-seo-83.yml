name: Audit 83 Live URLs SEO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-live-seo-83.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Crawl sitemap and audit HTTP canonical hreflang robots indexability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          BASE = 'https://serdararminsargut.pages.dev'
          SITEMAP = BASE + '/sitemap.xml'
          ROBOTS = BASE + '/robots.txt'
          UA = 'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          TIMEOUT = 25

          def norm(url):
              p = urllib.parse.urlsplit(url.strip())
              scheme = p.scheme.lower()
              host = (p.hostname or '').lower()
              port = p.port
              netloc = host
              if port and not ((scheme == 'https' and port == 443) or (scheme == 'http' and port == 80)):
                  netloc = f'{host}:{port}'
              path = p.path or '/'
              if path.endswith('/index.html'):
                  path = path[:-10] or '/'
              return urllib.parse.urlunsplit((scheme, netloc, path, p.query, ''))

          def fetch(url, ua=UA):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      raw = r.read()
                      ctype = r.headers.get_content_charset() or 'utf-8'
                      try:
                          text = raw.decode(ctype, errors='replace')
                      except LookupError:
                          text = raw.decode('utf-8', errors='replace')
                      headers = {k.lower(): ', '.join(r.headers.get_all(k) or []) for k in r.headers.keys()}
                      return {'status': r.getcode(), 'final': r.geturl(), 'headers': headers, 'text': text, 'error': ''}
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace') if e.fp else ''
                  headers = {k.lower(): ', '.join(e.headers.get_all(k) or []) for k in e.headers.keys()} if e.headers else {}
                  return {'status': e.code, 'final': e.geturl(), 'headers': headers, 'text': body, 'error': f'HTTPError {e.code}'}
              except Exception as e:
                  return {'status': 0, 'final': url, 'headers': {}, 'text': '', 'error': repr(e)}

          class HeadParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canonicals = []
                  self.hreflangs = []
                  self.meta = {}
                  self.html_lang = ''
              def handle_starttag(self, tag, attrs):
                  a = {str(k).lower(): (v or '') for k, v in attrs}
                  t = tag.lower()
                  if t == 'html' and not self.html_lang:
                      self.html_lang = a.get('lang', '').strip()
                  elif t == 'link':
                      rel = {x.lower() for x in re.split(r'\s+', a.get('rel', '').strip()) if x}
                      href = a.get('href', '').strip()
                      if 'canonical' in rel and href:
                          self.canonicals.append(href)
                      if 'alternate' in rel and a.get('hreflang', '').strip() and href:
                          self.hreflangs.append((a['hreflang'].strip(), href))
                  elif t == 'meta':
                      name = a.get('name', '').strip().lower()
                      if name in {'robots', 'googlebot', 'bingbot', 'yandex', 'yandexbot'}:
                          self.meta.setdefault(name, []).append(a.get('content', '').strip().lower())

          print(f'AUDIT_START | sitemap={SITEMAP}')
          sm = fetch(SITEMAP)
          if sm['status'] != 200:
              print(f'FATAL | sitemap HTTP {sm["status"]} | {sm["error"]}')
              sys.exit(2)
          root = ET.fromstring(sm['text'])
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [(n.text or '').strip() for n in root.findall('sm:url/sm:loc', ns) if (n.text or '').strip()]
          print(f'SITEMAP_COUNT | {len(urls)}')
          if len(urls) != 83:
              print(f'WARNING | expected 83 sitemap URLs, found {len(urls)}')

          rob = fetch(ROBOTS)
          print(f'ROBOTS_HTTP | {rob["status"]} | {ROBOTS}')
          rp = urllib.robotparser.RobotFileParser()
          rp.set_url(ROBOTS)
          if rob['status'] == 200:
              rp.parse(rob['text'].splitlines())
          else:
              print('WARNING | robots.txt unavailable; robots decisions marked false')

          rows = {}
          for i, url in enumerate(urls, 1):
              r = fetch(url)
              p = HeadParser()
              if r['text']:
                  try:
                      p.feed(r['text'])
                  except Exception as e:
                      print(f'PARSE_WARNING | {url} | {e!r}')
              canon_abs = [urllib.parse.urljoin(r['final'], x) for x in p.canonicals]
              unique_canon = list(dict.fromkeys(canon_abs))
              if len(unique_canon) == 1 and norm(unique_canon[0]) == norm(url):
                  canon_status = 'SELF'
              elif len(unique_canon) == 0:
                  canon_status = 'MISSING'
              elif len(unique_canon) > 1:
                  canon_status = 'MULTIPLE'
              else:
                  canon_status = 'OTHER'

              xrobots = r['headers'].get('x-robots-tag', '').lower()
              general_meta = ','.join(p.meta.get('robots', []))
              google_meta = ','.join(p.meta.get('googlebot', []))
              bing_meta = ','.join(p.meta.get('bingbot', []))
              yandex_meta = ','.join(p.meta.get('yandex', []) + p.meta.get('yandexbot', []))
              general_noindex = 'noindex' in general_meta or 'noindex' in xrobots
              google_noindex = general_noindex or 'noindex' in google_meta
              bing_noindex = general_noindex or 'noindex' in bing_meta
              yandex_noindex = general_noindex or 'noindex' in yandex_meta

              robots_g = rob['status'] == 200 and rp.can_fetch('Googlebot', url)
              robots_b = rob['status'] == 200 and rp.can_fetch('bingbot', url)
              robots_y = rob['status'] == 200 and rp.can_fetch('YandexBot', url)
              http_ok = r['status'] == 200
              final_ok = norm(r['final']) == norm(url)
              canon_ok = canon_status == 'SELF'
              google_idx = http_ok and final_ok and canon_ok and robots_g and not google_noindex
              bing_idx = http_ok and final_ok and canon_ok and robots_b and not bing_noindex
              yandex_idx = http_ok and final_ok and canon_ok and robots_y and not yandex_noindex

              hmap = {}
              hdups = []
              for lang, href in p.hreflangs:
                  code = lang.strip().lower()
                  href_abs = urllib.parse.urljoin(r['final'], href)
                  if code in hmap and norm(hmap[code]) != norm(href_abs):
                      hdups.append(code)
                  hmap[code] = href_abs

              rows[url] = {
                  'status': r['status'], 'final': r['final'], 'final_ok': final_ok,
                  'canonical_status': canon_status, 'canonicals': unique_canon,
                  'html_lang': p.html_lang, 'hreflangs': hmap, 'hreflang_dups': sorted(set(hdups)),
                  'robots_google': robots_g, 'robots_bing': robots_b, 'robots_yandex': robots_y,
                  'meta_robots': general_meta, 'x_robots': xrobots,
                  'google_noindex': google_noindex, 'bing_noindex': bing_noindex, 'yandex_noindex': yandex_noindex,
                  'google_indexable': google_idx, 'bing_indexable': bing_idx, 'yandex_indexable': yandex_idx,
                  'error': r['error'], 'reciprocal_errors': [], 'hreflang_target_errors': []
              }
              print(f'FETCH | {i:02d}/{len(urls)} | HTTP={r["status"]} | CANON={canon_status} | HREFLANG={len(hmap)} | ROBOTS=G{int(robots_g)}B{int(robots_b)}Y{int(robots_y)} | IDX=G{int(google_idx)}B{int(bing_idx)}Y{int(yandex_idx)} | {url}')

          sitemap_norm = {norm(u): u for u in urls}
          for src, row in rows.items():
              src_lang = row['html_lang'].strip().lower()
              hmap = row['hreflangs']
              if hmap:
                  if src_lang:
                      self_href = hmap.get(src_lang)
                      if not self_href or norm(self_href) != norm(src):
                          row['hreflang_target_errors'].append(f'missing_or_wrong_self_hreflang:{src_lang}')
                  else:
                      row['hreflang_target_errors'].append('missing_html_lang')
              for code, target in hmap.items():
                  if code == 'x-default':
                      continue
                  tnorm = norm(target)
                  if tnorm not in sitemap_norm:
                      row['hreflang_target_errors'].append(f'target_not_in_sitemap:{code}:{target}')
                      continue
                  target_url = sitemap_norm[tnorm]
                  target_row = rows[target_url]
                  if target_row['status'] != 200:
                      row['hreflang_target_errors'].append(f'target_http_{target_row["status"]}:{code}:{target}')
                  if norm(target_url) == norm(src):
                      continue
                  if not src_lang:
                      continue
                  back = target_row['hreflangs'].get(src_lang)
                  if not back or norm(back) != norm(src):
                      row['reciprocal_errors'].append(f'{code}->{target_url} missing backlink hreflang={src_lang}')

          http200 = sum(r['status'] == 200 for r in rows.values())
          selfcanon = sum(r['canonical_status'] == 'SELF' for r in rows.values())
          redirects = sum(not r['final_ok'] for r in rows.values())
          g_allowed = sum(r['robots_google'] for r in rows.values())
          b_allowed = sum(r['robots_bing'] for r in rows.values())
          y_allowed = sum(r['robots_yandex'] for r in rows.values())
          g_idx = sum(r['google_indexable'] for r in rows.values())
          b_idx = sum(r['bing_indexable'] for r in rows.values())
          y_idx = sum(r['yandex_indexable'] for r in rows.values())
          hreflang_pages = sum(bool(r['hreflangs']) for r in rows.values())
          reciprocity_pages = sum(bool(r['reciprocal_errors']) for r in rows.values())
          hreflang_problem_pages = sum(bool(r['hreflang_target_errors'] or r['hreflang_dups']) for r in rows.values())
          noindex_pages = sum(r['google_noindex'] or r['bing_noindex'] or r['yandex_noindex'] for r in rows.values())

          print('SUMMARY_BEGIN')
          print(f'TOTAL | {len(rows)}')
          print(f'HTTP_200 | {http200}/{len(rows)}')
          print(f'FINAL_URL_MATCH | {len(rows)-redirects}/{len(rows)}')
          print(f'SELF_CANONICAL | {selfcanon}/{len(rows)}')
          print(f'ROBOTS_ALLOWED_GOOGLE | {g_allowed}/{len(rows)}')
          print(f'ROBOTS_ALLOWED_BING | {b_allowed}/{len(rows)}')
          print(f'ROBOTS_ALLOWED_YANDEX | {y_allowed}/{len(rows)}')
          print(f'NOINDEX_PRESENT | {noindex_pages}/{len(rows)}')
          print(f'HREFLANG_PRESENT | {hreflang_pages}/{len(rows)}')
          print(f'HREFLANG_TARGET_PROBLEM_PAGES | {hreflang_problem_pages}/{len(rows)}')
          print(f'HREFLANG_RECIPROCITY_PROBLEM_PAGES | {reciprocity_pages}/{len(rows)}')
          print(f'INDEXABLE_GOOGLE | {g_idx}/{len(rows)}')
          print(f'INDEXABLE_BING | {b_idx}/{len(rows)}')
          print(f'INDEXABLE_YANDEX | {y_idx}/{len(rows)}')
          print('SUMMARY_END')

          problems = 0
          for url, r in rows.items():
              issues = []
              if r['status'] != 200: issues.append(f'HTTP_{r["status"]}')
              if not r['final_ok']: issues.append(f'REDIRECT->{r["final"]}')
              if r['canonical_status'] != 'SELF': issues.append(f'CANON_{r["canonical_status"]}:{"|".join(r["canonicals"])}')
              if not r['robots_google']: issues.append('ROBOTS_BLOCK_GOOGLE')
              if not r['robots_bing']: issues.append('ROBOTS_BLOCK_BING')
              if not r['robots_yandex']: issues.append('ROBOTS_BLOCK_YANDEX')
              if r['google_noindex'] or r['bing_noindex'] or r['yandex_noindex']: issues.append('NOINDEX')
              if r['hreflang_dups']: issues.append('HREFLANG_DUP:' + ','.join(r['hreflang_dups']))
              issues.extend('HREFLANG:' + x for x in r['hreflang_target_errors'])
              issues.extend('RECIPROCAL:' + x for x in r['reciprocal_errors'])
              if issues:
                  problems += 1
                  print(f'PROBLEM | {url} | ' + ' ; '.join(issues))

          with open('seo-audit-83.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['url','http','final_url','canonical','html_lang','hreflang_count','robots_google','robots_bing','robots_yandex','google_indexable','bing_indexable','yandex_indexable','hreflang_target_errors','reciprocal_errors'])
              for url, r in rows.items():
                  w.writerow([url,r['status'],r['final'],r['canonical_status'],r['html_lang'],len(r['hreflangs']),r['robots_google'],r['robots_bing'],r['robots_yandex'],r['google_indexable'],r['bing_indexable'],r['yandex_indexable'],' | '.join(r['hreflang_target_errors']),' | '.join(r['reciprocal_errors'])])
          with open('seo-audit-83.json', 'w', encoding='utf-8') as f:
              json.dump(rows, f, ensure_ascii=False, indent=2)

          print(f'PROBLEM_PAGES | {problems}/{len(rows)}')
          # Audit completed even when SEO problems are found; the report is the result.
          sys.exit(0)
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-83
          path: |
            seo-audit-83.csv
            seo-audit-83.json
          retention-days: 7
