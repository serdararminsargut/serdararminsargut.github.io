name: Security preview HTTP diagnostic (READ ONLY, NO DEPLOY)
on:
  push:
    branches: ['test/security-disclosure-20261104']
    paths: ['.github/workflows/security-preview-http-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/test/security-disclosure-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Diagnose preview vs base Pages hosts (no credentials, no writes)
        shell: bash
        run: |
          set -uo pipefail
          for url in \
            https://5266f6a8.serdararminsargut.pages.dev/.well-known/security.txt \
            https://ac00ded1.duru-mualla-sargut-site.pages.dev/.well-known/security.txt \
            https://serdararminsargut.pages.dev/ \
            https://duru-mualla-sargut-site.pages.dev/
          do
            echo "::group::PROBE $url"
            code="$(curl -sS --connect-timeout 6 --max-time 12 -o /dev/null -w 'HTTP=%{http_code} DNS=%{time_namelookup} CONNECT=%{time_connect} TLS=%{time_appconnect} TOTAL=%{time_total} IP=%{remote_ip}' "$url" 2>&1)"
            echo "$code"
            echo "::endgroup::"
          done
          echo 'DIAGNOSTIC_ONLY: no Cloudflare account credentials, no changes, no HTTP PASS assertion.'
