name: Verify live ProfilePage dateModified fix

on:
  push:
    branches:
      - test/preview-deploy-datemodified-20260925

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production deploy is live on 8 URLs
        shell: bash
        run: |
          set -euo pipefail

          base='https://serdararminsargut.com'
          paths=(
            '/az/'
            '/ar/'
            '/kk/'
            '/ru/'
            '/ky/'
            '/en/'
            '/uz/'
            '/casting-card/en'
          )

          expected=(
            'https://serdararminsargut.com/az/'
            'https://serdararminsargut.com/ar/'
            'https://serdararminsargut.com/kk/'
            'https://serdararminsargut.com/ru/'
            'https://serdararminsargut.com/ky/'
            'https://serdararminsargut.com/en/'
            'https://serdararminsargut.com/uz/'
            'https://serdararminsargut.com/casting-card/en'
          )

          # Allow a short propagation window before the strict 8-URL check.
          ready=0
          for attempt in $(seq 1 24); do
            body='/tmp/readiness-body'
            code=$(curl -sS -L --max-redirs 3 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -o "$body" -w '%{http_code}' "$base/en/" || true)
            dm='YOK'
            grep -q '"dateModified"' "$body" 2>/dev/null && dm='VAR'
            echo "Readiness attempt $attempt: HTTP=$code dateModified=$dm"
            if [[ "$code" == "200" && "$dm" == "YOK" ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          [[ "$ready" == "1" ]] || { echo "Production did not expose the fixed HTML within the propagation window" >&2; exit 1; }

          pass=0
          fail=0

          for i in "${!paths[@]}"; do
            path="${paths[$i]}"
            want="${expected[$i]}"
            body="/tmp/live-body-$i"
            headers="/tmp/live-headers-$i"

            info=$(curl -sS -L --max-redirs 3 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$body" \
              -w '%{http_code}|%{url_effective}' "$base$path")

            code="${info%%|*}"
            final="${info#*|}"

            canonical=$(python - "$body" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          m = re.search(
              r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)["\']'
              r'|<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',
              text,
              re.I,
          )
          print((m.group(1) or m.group(2)) if m else '')
          PY
            )

            profile='NO'
            grep -q '"@type"[[:space:]]*:[[:space:]]*"ProfilePage"' "$body" && profile='YES'

            datemod='YOK'
            if grep -q '"dateModified"' "$body"; then
              datemod='VAR'
            fi

            status='PASS'
            [[ "$code" == "200" ]] || status='FAIL'
            [[ "$final" == "$want" ]] || status='FAIL'
            [[ "$canonical" == "$want" ]] || status='FAIL'
            [[ "$profile" == "YES" ]] || status='FAIL'
            [[ "$datemod" == "YOK" ]] || status='FAIL'

            echo "================================================"
            echo "PATH         : $path"
            echo "HTTP         : $code"
            echo "FINAL URL    : $final"
            echo "CANONICAL    : ${canonical:-BULUNAMADI}"
            echo "EXPECTED     : $want"
            echo "ProfilePage  : $profile"
            echo "dateModified : $datemod"
            echo "SONUC        : $status"

            if [[ "$status" == "PASS" ]]; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
            fi
          done

          echo "================================================"
          echo "PASS_COUNT=$pass"
          echo "FAIL_COUNT=$fail"

          [[ "$pass" == "8" && "$fail" == "0" ]]
          echo "PASS: 8/8 production URLs validated"
