name: Serdar HugoBlox source release candidate — NO DEPLOY
on:
  push:
    branches:
      - test/hugoblox-source-integration-20261103
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serdar-hugoblox-source-rc-check-only
  cancel-in-progress: true
jobs:
  production-source-proof:
    if: github.ref == 'refs/heads/test/hugoblox-source-integration-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout only source candidate; never main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact expected main and project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'serdararminsargut/serdararminsargut.github.io'
          test "$GITHUB_REF_NAME" = 'test/hugoblox-source-integration-20261103'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = 'bb4737ed7367b84008c860ec3f722055a56ae518'
          test "$(git hash-object .github/workflows/deploy-cloudflare-pages.yml)" = 'd86882c71b809b6e3f976d1cd509a66cc433fb64'
          ! git diff 'bb4737ed7367b84008c860ec3f722055a56ae518' HEAD --name-only | grep -E '^(downloads/|assets/|casting-card/|links/)' 
      - name: Prepare true production copy, excluding deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_serdar_production_main_static.py --production-source .
      - name: Generate four existing Comp Card PDFs locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.63.0' 'pypdf>=5,<7' 'Pillow>=10,<13'
          python3 -m playwright install --with-deps chromium
          python3 scripts/serdar_generate_comp_cards.py dist
      - name: Validate original generated PDFs against exact pinned main build (BASELINE ONLY)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/serdar_generate_comp_cards.py)" = "$(git rev-parse bb4737ed7367b84008c860ec3f722055a56ae518:scripts/serdar_generate_comp_cards.py)"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('dist/downloads')
          report=json.loads((root/'serdar-pdf-evidence.json').read_text(encoding='utf-8'))
          assert report.get('project')=='SERDAR_ONLY'
          records={r['language']:r for r in report['files']}
          assert set(records)=={'TR','EN','AR','RU'}
          for lang in ('TR','EN','AR','RU'):
              rec=records[lang]
              expected=f'downloads/Serdar-Armin-Sargut-Comp-Card-{lang}.pdf'
              assert rec['file']==expected, (lang,'filename mismatch')
              p=root/f'Serdar-Armin-Sargut-Comp-Card-{lang}.pdf'
              data=p.read_bytes()
              assert data.startswith(b'%PDF-')
              assert len(data)==rec['bytes']
              assert hashlib.sha256(data).hexdigest()==rec['sha256']
              assert rec['pages'] in (1,2)
          print('SERDAR_GENERATED_ORIGINAL_PDF_BASELINE_PASS 4/4, NOT A LIVE-SERVER BYTE BACKUP')
          PY
      - name: Preserve generated original four PDF baseline (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: serdar-original-comp-cards-reproducible-baseline-no-deploy
          path: |
            dist/downloads/Serdar-Armin-Sargut-Comp-Card-TR.pdf
            dist/downloads/Serdar-Armin-Sargut-Comp-Card-EN.pdf
            dist/downloads/Serdar-Armin-Sargut-Comp-Card-AR.pdf
            dist/downloads/Serdar-Armin-Sargut-Comp-Card-RU.pdf
            dist/downloads/serdar-pdf-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify production candidate source diff, PDFs, sitemap, new guides
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hugoblox_source_release_ci.py --project SERDAR --repo . --built dist
          python3 scripts/hugoblox_source_release_http_qa.py \
            --project SERDAR --static-root dist --output-json "$RUNNER_TEMP/serdar-source-release-http.json"
          grep -Fq '"status": "LOCAL_PRODUCTION_MIRROR_HTTP_ACCEPTANCE_PASS"' "$RUNNER_TEMP/serdar-source-release-http.json"
          cp "$RUNNER_TEMP/serdar-source-release-http.json" serdar-source-release-http-proof.json
      - name: Prepare four-language PDF layout preview in isolated runner (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/serdar_comp_card_pdf_layout_preview.py)" = '248035d152aa680c31ba949ee41b965387997353'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-core
          python3 -m pip install --disable-pip-version-check 'pymupdf==1.26.4'
          python3 scripts/serdar_comp_card_pdf_layout_preview.py \
            --source-root dist --output-dir "$RUNNER_TEMP/serdar-pdf-layout-preview"
      - name: Preserve 4 watermarked PDFs outside production dist
        uses: actions/upload-artifact@v4
        with:
          name: serdar-comp-card-4lang-watermarked-preview-no-deploy
          path: ${{ runner.temp }}/serdar-pdf-layout-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Build four clean visual candidates outside dist (STAGING ONLY)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/serdar_clean_candidate_staging.py)" = '1066f81f6b99dfc9899f7644fc5449e9c197450b'
          python3 scripts/serdar_clean_candidate_staging.py \
            --input-dir "$RUNNER_TEMP/serdar-pdf-layout-preview" \
            --output-dir "$RUNNER_TEMP/serdar-pdf-clean-staging"
      - name: Preserve four clean candidates as NO-DEPLOY artifact
        uses: actions/upload-artifact@v4
        with:
          name: serdar-comp-card-4lang-clean-visual-candidates-not-published
          path: ${{ runner.temp }}/serdar-pdf-clean-staging/
          if-no-files-found: error
          retention-days: 14
      - name: Generate metadata-cleaned preprod PDFs in isolated runner (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/serdar_pdf_metadata_preprod.py)" = 'ea91bb95aa1e9983d8baa9d6255a2a3f112dd3ae'
          python3 scripts/serdar_pdf_metadata_preprod.py \
            --input-root "$RUNNER_TEMP/serdar-pdf-clean-staging" \
            --output-root "$RUNNER_TEMP/serdar-pdf-metadata-preprod"
      - name: Retain metadata-cleaned 4lang PDFs as staging proof
        uses: actions/upload-artifact@v4
        with:
          name: serdar-comp-card-4lang-metadata-clean-preprod-NOT-PUBLISHED
          path: ${{ runner.temp }}/serdar-pdf-metadata-preprod/
          if-no-files-found: error
          retention-days: 14
      - name: Simulate all four live PDF routes and real browser clicks in a temp mirror ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/serdar_preprod_pdf_route_sim.py)" = 'b698992717e459411cd6594004c3662689e13a83'
          python3 scripts/serdar_preprod_pdf_route_sim.py \
            --source-root dist \
            --candidate-root "$RUNNER_TEMP/serdar-pdf-metadata-preprod" \
            --overlay-root "$RUNNER_TEMP/serdar-routing-mirror"
      - name: Preserve four-language local HTTP/browser proof only (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: serdar-4lang-preprod-download-routing-proof-no-deploy
          path: ${{ runner.temp }}/SERDAR_4_DIL_ROUTING_SIM_NO_DEPLOY_PROOF.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve local-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: serdar-hugoblox-source-rc-no-deploy-proof
          path: serdar-source-release-http-proof.json
          if-no-files-found: error
          retention-days: 14
