name: Apply site routing sync

on:
  push:
    branches: [site-routing-sync]
    paths:
      - .github/workflows/apply-site-routing-sync.yml
      - scripts/apply_site_routing_sync.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: site-routing-sync

      - name: Apply verified source patch
        run: python3 scripts/apply_site_routing_sync.py

      - name: Commit patched index
        run: |
          git config user.name "sargutportfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Activate model filters and Comp Card routing"
          git push origin HEAD:site-routing-sync
