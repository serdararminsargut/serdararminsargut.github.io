<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://serdararminsargut.pages.dev/">
  <title>Sayfa bulunamadı | Serdar Armin Sargut</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 2rem)); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Sayfa bulunamadı</h1>
    <p id="status">Aradığınız sayfa bu GitHub aynasında bulunamadı.</p>
    <p><a href="https://serdararminsargut.pages.dev/">Ana portföy sitesine git</a></p>
  </main>
  <script>
    (() => {
      "use strict";
      const canonicalOrigin = "https://serdararminsargut.pages.dev";
      const verifiedPaths = Object.freeze({
        "/": "/",
        "/en/": "/en/",
        "/ar/": "/ar/",
        "/ru/": "/ru/",
        "/az/": "/az/",
        "/kk/": "/kk/",
        "/uz/": "/uz/",
        "/ky/": "/ky/",
        "/casting-card/": "/casting-card/",
        "/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/": "/rehber/turk-dunyasi-cocuk-oyuncu-model-portfoyu/",
        "/rehber/korfez-cocuk-model-portfoyu/": "/rehber/korfez-cocuk-model-portfoyu/",
        "/en/gulf-child-model-portfolio/": "/en/gulf-child-model-portfolio/",
        "/ar/dalil-malaf-model-atfal-al-khalij/": "/ar/dalil-malaf-model-atfal-al-khalij/",
        "/card.html": "/card",
        "/card": "/card",
        "/postcard.html": "/postcard",
        "/postcard": "/postcard"
      });
      const verifiedPath = verifiedPaths[window.location.pathname];
      if (verifiedPath !== undefined) {
        document.getElementById("status").textContent = "Ana Cloudflare Pages sitesine yönlendiriliyorsunuz…";
        window.location.replace(canonicalOrigin + verifiedPath);
      }
    })();
  </script>
</body>
</html>
